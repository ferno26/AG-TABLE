function playoffsHTML(){
  const done = groupStageComplete();
  const pic = playoffPicture();
  const [s1,s2,s3,s4] = pic.seeds;
  const tvv = n=> n ? teamColor(n) : 'var(--line)';
  const played = state.fixtures.filter(f=>f.played).length;
  const pf = state.format.playoffs;

  function seriesCard(stage, a, b, placeholderB){
    const bo = PLAYOFF_BO[stage], need = winsNeeded(bo);
    const res = stage==='semi' ? pic.semi : pic.fin;
    const title = stage==='semi' ? 'Semi-final' : 'Grand Final';
    const ready = done && a && b;
    if(editingPlayoff===stage && ready){
      return `<article class="fx is-editing ${stage}">
        <div class="fx-head"><span class="fx-label">${title}, best of ${bo}, first to ${need} games</span></div>
        <div class="fx-row win" style="--team:${tvv(a)}"><span class="fx-team">${esc(L(a))}</span><input class="num-input sm" type="number" inputmode="numeric" min="0" max="${need}" id="poA" placeholder="0" aria-label="${esc(L(a))} games won" value="${res?res.ga:''}"></div>
        <div class="fx-row win" style="--team:${tvv(b)}"><span class="fx-team">${esc(L(b))}</span><input class="num-input sm" type="number" inputmode="numeric" min="0" max="${need}" id="poB" placeholder="0" aria-label="${esc(L(b))} games won" value="${res?res.gb:''}"></div>
        <p class="fx-msg" id="poMsg"></p>
        <div class="fx-actions"><button class="btn btn-red btn-sm" id="poSave" data-stage="${stage}">Save result</button><button class="btn btn-sm" id="poCancel">Cancel</button>${res ? `<button class="btn btn-danger btn-sm" id="poClear" data-stage="${stage}">Clear</button>` : ''}</div>
        <div class="fx-forfeit"><span>Fewer than 3 players?</span><button class="mini-btn" data-po-ff="a">${esc(L(a))} forfeits</button><button class="mini-btn" data-po-ff="b">${esc(L(b))} forfeits</button></div>
      </article>`;
    }
    const row = (n, g, side)=>`<div class="fx-row ${res ? (res.winner===n ? 'win' : '') : 'win'}" style="--team:${tvv(n)}"><span class="fx-team">${n ? esc(L(n)) : `<span class="tbd">${placeholderB}</span>`}${res && res.forfeit===side ? ' <span class="ff-tag">Forfeit</span>' : ''}</span>${res ? `<span class="fx-score">${g}</span>` : ''}</div>`;
    const btn = ready ? `<button class="mini-btn ${res?'':'accent'} admin-only" data-po-edit="${stage}">${res?'Edit':'Enter result'}</button>` : '';
    return `<article class="fx ${stage}"><div class="fx-head"><span class="fx-label">${title}, best of ${bo}</span>${btn}</div>${row(a, res?res.ga:'', 'a')}${row(b, res?res.gb:'', 'b')}</article>`;
  }
  const seedRow = (n, i, label, cls)=>`<li><span class="rk" style="font-size:24px;${i===0?'color:var(--champ)':''}">${i+1}</span>
    <div class="tm" style="--team:${tvv(n)};flex:1"><div class="tm-text"><div class="tm-name">${esc(L(n))}</div><div class="tm-nick">${esc(shortNick(n))}</div></div><span class="q-tag ${cls}">${label}</span></div></li>`;

  let html = `<div class="page-head"><h1>Playoffs</h1><p>${done ? 'Group stage complete. Seeding is locked.' : 'Projected from current standings, '+played+' of '+state.fixtures.length+' group matches played.'}</p></div>
    <div class="flow">
      <div class="flow-step"><h3>Group stage</h3><p>Every team plays each other twice. The top three advance.</p></div>
      <div class="flow-step"><h3>Semi-final</h3><p>Second plays third, best of 3. The loser finishes third.</p></div>
      <div class="flow-step final"><h3>Grand Final</h3><p>First place plays the Semi-final winner, best of 5.</p></div>
    </div>
    <p class="fine">Every playoff game uses the ${pf.rounds}-round format on ${esc(pf.map)}.</p>
    <div class="block-head" style="margin-top:28px;"><h2>Qualification</h2><span class="count">${done ? 'Confirmed' : 'Projected'}</span></div>
    <section class="card"><ul class="seeds">${seedRow(s1,0,'Grand Final','q-final')}${seedRow(s2,1,'Semi-final','q-semi')}${seedRow(s3,2,'Semi-final','q-semi')}${seedRow(s4,3,'Eliminated','q-out')}</ul></section>`;
  if(pic.semiStale || pic.finStale) html += `<p class="note">A group result changed the seeding, so the affected playoff result was set aside. Enter it again below.</p>`;
  html += `<div class="block-head" style="margin-top:28px;"><h2>Bracket</h2><span class="count">${done ? '' : 'Opens after the group stage'}</span></div>
    <div class="bracket">${seriesCard('semi', pic.semiTeams[0], pic.semiTeams[1], '')}${seriesCard('final', pic.finalTeams[0], pic.finalTeams[1], 'Semi-final winner')}</div>`;
  if(pic.fin){
    const champ = pic.fin.winner;
    const runner = champ===pic.fin.a ? pic.fin.b : pic.fin.a;
    const third = pic.semi.winner===pic.semi.a ? pic.semi.b : pic.semi.a;
    html += `<div class="block-head" style="margin-top:28px;"><h2>Final standings</h2></div>
      <section class="champion"><img class="stage-mark" src="${LOGO_ICON_SRC}" alt=""><div class="lbl">Champions</div><h2>${esc(shortNick(champ))}</h2></section>
      <section class="card" style="margin-top:10px;"><ul class="placings">${[[champ,'Champion'],[runner,'Runner-up'],[third,'Third'],[s4,'Fourth']].map(([n,l],i)=>`<li><span class="rk" style="font-size:24px;${i===0?'color:var(--champ)':''}">${i+1}</span><div class="tm" style="--team:${tvv(n)};flex:1"><div class="tm-text"><div class="tm-name">${esc(L(n))}</div><div class="tm-nick">${esc(shortNick(n))}</div></div><span class="q-tag ${i===0?'q-final':''}">${l}</span></div></li>`).join('')}</ul></section>`;
  }
  return html;
}
function bindPlayoffsEvents(){
  document.querySelectorAll('#playoffs [data-po-edit]').forEach(b=>{
    b.onclick = ()=>{ editingPlayoff = b.dataset.poEdit; renderPlayoffsOnly(); const i = document.getElementById('poA'); if(i) i.focus(); };
  });
  const save = document.getElementById('poSave');
  if(!save) return;
  const A = document.getElementById('poA'), B = document.getElementById('poB');
  const stage = save.dataset.stage, bo = PLAYOFF_BO[stage], need = winsNeeded(bo);
  const num = el=> el.value==='' ? NaN : Number(el.value);
  const check = ()=>{
    const a = num(A), b = num(B);
    const msg = document.getElementById('poMsg');
    const err = (isNaN(a) && isNaN(b)) ? '' : validateSeries(bo, a, b);
    msg.textContent = err || (!isNaN(a) && !isNaN(b) ? (a>b ? A.closest('.fx-row').querySelector('.fx-team').textContent : B.closest('.fx-row').querySelector('.fx-team').textContent)+' wins '+Math.max(a,b)+'–'+Math.min(a,b) : '');
    msg.className = 'fx-msg' + (err ? ' err' : '');
  };
  A.oninput = ()=>{ if(num(A)!==need && isNaN(num(B))) B.value = need; check(); };
  B.oninput = ()=>{ if(num(B)!==need && isNaN(num(A))) A.value = need; check(); };
  check();
  save.onclick = ()=> savePlayoff(stage, num(A), num(B));
  document.getElementById('poCancel').onclick = ()=>{ editingPlayoff = null; renderPlayoffsOnly(); };
  const clr = document.getElementById('poClear'); if(clr) clr.onclick = ()=> clearPlayoff(clr.dataset.stage);
  document.querySelectorAll('#playoffs [data-po-ff]').forEach(b=>{
    b.onclick = ()=>{ const side = b.dataset.poFf; savePlayoff(stage, side==='a' ? 0 : need, side==='a' ? need : 0, side); };
  });
}
function renderPlayoffsOnly(){
  document.getElementById('playoffs').innerHTML = playoffsHTML();
  bindPlayoffsEvents();
}

function isAvail(id){ return !(state.unavailable && state.unavailable[id]); }
function rosterMembers(k){
  const t = state.teams[k], pr = prof(k);
  return t.roster.map(r=> r.cat==='L'
    ? { id:r.id, name:leaderPerson(k), chip: pr.captainId ? 'Leader' : 'Captain', chipCls:'L', price:0, captain: !pr.captainId }
    : { id:r.id, name:r.name, chip:CAT_LABEL[r.cat], chipCls:r.cat, price:r.price, captain: pr.captainId===r.id });
}
function rostersHTML(){
  const rosterTitles = computeTitles(playerStats());
  const cards = LEADER_KEYS.map(k=>{
    const t = state.teams[k];
    const members = rosterMembers(k);
    const open = Math.max(0, squadSize() - members.length);
    const avail = members.filter(m=>isAvail(m.id)).length;
    const low = avail < 3;
    return `<article class="roster" style="--team:${teamColor(k)}">
      <header class="roster-head">${avatarHTML(k,'roster-photo')}
        <div class="roster-title"><h3>${esc(shortNick(k))}</h3><p>Captain ${esc(L(k))}</p></div>
        <div class="roster-purse"><div class="n">${t.purse}</div><span>${money(t.purse)} left</span></div>
      </header>
      <div class="avail-bar ${low?'low':''}"><b>${avail} of ${members.length}</b> available${low ? '. Below the 3-player minimum, so this team forfeits unless fixed by match time.' : ''}</div>
      <ul class="roster-list">
        ${members.map(m=>`<li class="${isAvail(m.id)?'':'is-out'}">
          <span class="nm">${esc(m.name)} <span class="ic">${titleIcons(m.id, rosterTitles)}</span></span>
          ${m.captain && m.chipCls!=='L' ? '<span class="chip chip-L">Captain</span>' : ''}
          <span class="chip chip-${m.chipCls}">${m.chip}</span>
          <span class="pr">${m.price ? m.price : '0'}<small>${m.price ? money(m.price) : ''}</small></span>
          <button class="avail admin-only ${isAvail(m.id)?'on':''}" data-avail="${m.id}" aria-pressed="${isAvail(m.id)}">${isAvail(m.id)?'In':'Out'}</button>
          <span class="avail-ro viewer-only ${isAvail(m.id)?'on':''}">${isAvail(m.id)?'In':'Out'}</span>

      </ul>
    </article>`;
  }).join('');
  return `<div class="page-head"><h1>Rosters</h1><p>${squadSize()} players per team: the captain, ${A_CAP} A-Class and ${capFor('O')} Other. Teams need 3 available players to play.</p></div><div class="roster-grid">${cards}</div>`;
}
function bindRostersEvents(){

}

        <label class="fld"><span>Leader name</span><input class="in" data-f="leaderName" maxlength="24" value="${esc(leaderPerson(k))}"></label>
        <label class="fld"><span>Captain</span><select class="field" data-f="captainId"><option value="">${esc(leaderPerson(k))} (leader)</option>${drafted.map(p=>`<option value="${p.id}" ${pr.captainId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>

        <div class="btn-row" style="margin-top:12px;">

          <input type="file" accept="image/*" data-photo-input="${k}" style="display:none;">
        </div>
      </div>`; }).join('')}</div>
    <div class="hint">Picking a new captain transfers leadership to that drafted player. The original leader stays in the squad.</div>

    <div class="section-title">Economy</div>
    <div class="panel">

        <input class="num-input" type="number" inputmode="decimal" id="ecRate" min="0" step="0.5" value="${state.economy.rate}">

        <div class="lbl">${i===0?'First':'Return'} leg<small>Matches ${i*3+1} to ${i*3+3} for each team</small></div>
        <input class="in" style="width:150px" data-leg-map="${i}" maxlength="24" value="${esc(l.map)}" aria-label="Map">
        <input class="num-input" type="number" inputmode="numeric" data-leg-rounds="${i}" min="1" value="${l.rounds}" aria-label="Rounds">

      <div class="aud-row">

function renderAuditorOnly(){
  document.getElementById('auditor').innerHTML = auditorPage();
  bindAuditorEvents();
  syncAuditorClass(); renderAnalyticsOnly();
}
function bindAuditorEvents(){
  const lb = document.getElementById('loginBtn');
  if(lb){
    const go = async ()=>{
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      if(!email || !pass){ toast('Enter email and password'); return; }
      lb.disabled = true;
      try{ await cloud.auth.signInWithEmailAndPassword(email, pass); toast('Signed in — your changes are live'); }
      catch(err){ lb.disabled = false; toast(/invalid|wrong|not-found|credential/i.test(err && err.code || '') ? 'Wrong email or password' : 'Sign-in failed'); }
    };
    lb.onclick = go;
    document.getElementById('loginPass').onkeydown = e=>{ if(e.key==='Enter') go(); };
    return;
  }
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = ()=> cloud.auth.signOut().then(()=> toast('Signed out'));
  const pinBtn = document.getElementById('pinSubmit');
  if(pinBtn){
    const input = document.getElementById('pinInput');
    const submit = ()=>{
      if(input.value === AUDITOR_PIN){ auditorUnlocked = true; renderAuditorOnly(); }
      else { input.style.borderColor = 'var(--crimson)'; input.value=''; toast('Wrong PIN'); }
    };
    pinBtn.onclick = submit;
    input.onkeydown = e=>{ if(e.key==='Enter') submit(); };
    return;
  }
  const sp = document.getElementById('btnSavePurses');
  if(sp) sp.onclick = ()=>{
    let changed = 0;
    document.querySelectorAll('#auditor [data-purse]').forEach(inp=>{
      const v = parseInt(inp.value,10);
      const name = inp.dataset.purse;
      if(!isNaN(v) && v>=0 && state.teams[name].purse!==v){ state.teams[name].purse = v; changed++; }
    });
    saveState(); render();
    toast(changed ? 'Points updated for '+changed+' leader'+(changed>1?'s':'') : 'No changes');
  };
  document.querySelectorAll('#auditor [data-price-save]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.priceSave;
      const p = playerById(id);
      const inp = document.querySelector('#auditor [data-price="'+id+'"]');
      const v = parseInt(inp.value,10);
      if(!p || isNaN(v) || v<0) return;
      const delta = v - p.price;
      if(delta===0){ toast('No change'); return; }
      const team = state.teams[p.team];
      team.purse -= delta;
      const r = team.roster.find(x=>x.id===id); if(r) r.price = v;
      p.price = v;
      saveState(); render();
      toast(p.name+' → '+v+' pts · '+p.team+' now '+team.purse);
    };
  });
  document.querySelectorAll('#auditor [data-undo]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.undo;
      const p = playerById(id);
      if(!p || p.status!=='sold') return;
      const team = state.teams[p.team];
      const idx = team.roster.findIndex(r=>r.id===id);
      if(idx>-1){ team.purse += team.roster[idx].price; team.roster.splice(idx,1); }
      const from = p.team;
      p.status='available'; p.team=null; p.price=null;
      saveState(); render();
      toast(p.name+' returned to the queue · '+from+' refunded');
    };
  });
  const on = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  document.querySelectorAll('#auditor [data-team-save]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.teamSave;
      const card = document.querySelector('#auditor [data-team-card="'+k+'"]');
      const get = f=> card.querySelector('[data-f="'+f+'"]').value;
      const pr = Object.assign({}, prof(k));
      pr.teamName = get('teamName').trim() || TEAMS_META[k].nickname;
      pr.leaderName = get('leaderName').trim() || k;
      pr.captainId = get('captainId') || null;
      pr.color = get('color');
      pr.geo = get('geo');
      if(!pr.captainId) delete pr.captainId;
      state.profiles[k] = pr;
      saveState(); render();
      toast(teamName(k)+' updated');
    };
  });
  document.querySelectorAll('#auditor [data-photo]').forEach(b=>{
    const k = b.dataset.photo;
    const input = document.querySelector('#auditor [data-photo-input="'+k+'"]');
    b.onclick = ()=> input.click();
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          const W = 300, H = 400, c = document.createElement('canvas');
          c.width = W; c.height = H;
          const s = Math.max(W/img.width, H/img.height);
          const w = img.width*s, h = img.height*s;
          c.getContext('2d').drawImage(img, (W-w)/2, Math.min(0,(H-h)/3), w, h);
          if(!state.photos) state.photos = {};
          state.photos[k] = c.toDataURL('image/jpeg', 0.82);
          saveState(); pushPhotos(); render();
          toast(L(k)+"'s photo updated");
        };
        img.onerror = ()=> toast("That file isn't an image");
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('#auditor [data-photo-reset]').forEach(b=>{
    b.onclick = ()=>{ const k = b.dataset.photoReset; delete state.photos[k]; saveState(); pushPhotos(); render(); toast('Photo reset'); };
  });
  on('btnSaveEconomy', ()=>{
    const rate = parseFloat(document.getElementById('ecRate').value);
    if(isNaN(rate) || rate<0){ toast('Enter a valid rate'); return; }
    state.economy = { rate, symbol: document.getElementById('ecSymbol').value };
    saveState(); render();
    toast('1 point now equals '+money(1));
  });
  on('btnSaveFormat', ()=>{
    const legs = state.format.legs.map((l,i)=>({
      map: (document.querySelector('#auditor [data-leg-map="'+i+'"]').value.trim() || l.map),
      rounds: parseInt(document.querySelector('#auditor [data-leg-rounds="'+i+'"]').value,10)
    }));
    const pr = parseInt(document.getElementById('pfRounds').value,10);
    if(legs.some(l=>isNaN(l.rounds) || l.rounds<1) || isNaN(pr) || pr<1){ toast('Round counts must be 1 or more'); return; }
    state.format = { legs, playoffs:{ map: document.getElementById('pfMap').value.trim() || state.format.playoffs.map, rounds: pr } };
    saveState(); render();
    toast('Match format saved');
  });
  on('btnSaveAuction', ()=>{
    const t = parseInt(document.getElementById('acTimer').value,10);
    const a = parseInt(document.getElementById('acBaseA').value,10);
    const o = parseInt(document.getElementById('acBaseO').value,10);
    if([t,a,o].some(v=>isNaN(v) || v<0) || t<5){ toast('Check the timer (5+ seconds) and prices'); return; }
    state.auctionCfg = { timer:t, baseA:a, baseO:o };
    applyConfig();
    state.players.forEach(p=>{ if(p.status!=='sold') p.base = BASE[p.cat]; });
    if(!state.timerRunning) state.timeLeft = TIMER_START;
    saveState(); render();
    toast('Auction settings saved');
  });
  on('btnSaveScoring', ()=>{
    const ppr = parseInt(document.getElementById('scPpr').value,10);
    if(isNaN(ppr) || ppr<0){ toast('Enter a valid number'); return; }
    state.scoring = Object.assign({}, state.scoring, { pointsPerRound:ppr, loserKeeps: document.getElementById('scLoser').value==='keep' });
    saveState(); render();
    toast('Scoring updated');
  });
  on('btnSquadSize', ()=>{
    const v = parseInt(document.getElementById('squadSizeInput').value,10);
    const minNeeded = Math.max(A_CAP+1, ...LEADER_KEYS.map(n=>state.teams[n].roster.length));
    if(isNaN(v) || v<minNeeded || v>12){ toast('Pick a size between '+minNeeded+' and 12'); return; }
    state.squadSize = v; saveState(); render();
    toast('Squads are now '+v+' players');
  });
  on('btnSaveNow2', ()=> toast(saveState() ? 'Progress saved' : "Couldn't save here — use Export"));
  on('btnExport', exportSave);
  const importFile = document.getElementById('importFile');
  on('btnImportTrigger', ()=> importFile.click());
  if(importFile) importFile.onchange = ()=>{ if(importFile.files[0]) importSave(importFile.files[0]); };
  on('btnReset', ()=>{
    if(!resetArmed){
      resetArmed = true; renderAuditorOnly();
      setTimeout(()=>{ if(resetArmed){ resetArmed=false; renderAuditorOnly(); } }, 4000);
      return;
    }
    resetArmed = false;
    clearInterval(timerHandle);
    state = migrate(freshState()); state.dataRev = DATA_REV; applyConfig();
    saveState(); applyTheme(); render();
    toast('Tournament reset');
  });
}

async function exportSave(){
  saveState();
  const json = JSON.stringify(state, null, 2);
  let downloads = null;
  try{
    if(window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads');
  }catch(e){ downloads = null; }
  if(downloads){
    try{ await downloads.save({ filename:'apex_auction_state.json', data: json }); toast('Backup saved'); }
    catch(e){ if(e && e.code==='declined') toast('Backup cancelled'); else toast("Couldn't save the file here"); }
    return;
  }
  if(!window.claude){  // regular website (e.g. Vercel): normal file download
    try{
      const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = 'apex_auction_state.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      toast('Backup downloaded');
      return;
    }catch(e){}
  }
  try{ await navigator.clipboard.writeText(json); toast('Backup copied to clipboard'); }
  catch(e){ toast("Backup isn't available in this view"); }
}
function importSave(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = migrate(JSON.parse(e.target.result));
      if(!parsed) throw new Error('bad');
      clearInterval(timerHandle);
      state = parsed;
      state.dataRev = DATA_REV;
      applyConfig();
      saveState(); pushPhotos(); applyTheme(); render();
      toast('Backup restored');
    }catch(err){ toast("That file isn't an auction backup"); }
  };
  reader.readAsText(file);
}

/* =========================================================
   MATCH STATS: kills, MVPs, titles, rivalries
========================================================= */
const TITLES = {
  top:     { icon:'🔥', label:'Top Fragger',    desc:'Most total kills' },
  demon:   { icon:'💀', label:'Headshot Demon', desc:'Most kills in a single match' },
  bounty:  { icon:'👑', label:'Bounty Hunter',  desc:'Most match MVPs' },
  ghost:   { icon:'👻', label:'Ghost',          desc:'Fewest deaths per match' },
  sponge:  { icon:'🧽', label:'Bullet Sponge',  desc:'Most total deaths' },
  nemesis: { icon:'🎯', label:'Nemesis',        desc:'Biggest one-on-one rivalry in a match' }
};
function memberTeam(id){
  if(String(id).startsWith('leader-')) return String(id).slice(7);
  const p = playerById(id); return p ? p.team : null;
}
function memberName(id){
  if(String(id).startsWith('leader-')) return leaderPerson(String(id).slice(7));
  const p = playerById(id); return p ? p.name : 'Unknown';
}
function matchMvp(f){
  if(!f || !f.played || !f.stats) return null;
  const rows = Object.entries(f.stats).filter(([id,s])=> s && Number.isFinite(s.k));
  if(!rows.length) return null;
  rows.sort((a,b)=> b[1].k - a[1].k
    || ((memberTeam(b[0])===f.winner) - (memberTeam(a[0])===f.winner))
    || ((Number.isFinite(a[1].d) ? a[1].d : 99) - (Number.isFinite(b[1].d) ? b[1].d : 99))
    || memberName(a[0]).localeCompare(memberName(b[0])));
  const [id, s] = rows[0];
  if(s.k <= 0) return null;
  return { id, name: memberName(id), team: memberTeam(id), kills: s.k, deaths: s.d };
}
function topRival(f){
  const r = (f && Array.isArray(f.rivals) ? f.rivals : []).filter(x=>x && x.n>0);
  if(!r.length) return null;
  return r.slice().sort((a,b)=>b.n-a.n)[0];
}
function nemText(r){ return `<b>${esc(memberName(r.killer))}</b> targeted <b>${esc(memberName(r.victim))}</b> ${r.n} time${r.n===1?'':'s'}!`; }
function playerStats(){
  const agg = {};
  state.fixtures.forEach(f=>{
    if(!f.played || !f.stats) return;
    Object.entries(f.stats).forEach(([id,s])=>{
      const a = agg[id] || (agg[id] = { id, kills:0, deaths:0, matches:0, dMatches:0, best:0, mvps:0, rivalMax:0 });
      if(Number.isFinite(s.k)){ a.kills += s.k; a.matches++; a.best = Math.max(a.best, s.k); }
      if(Number.isFinite(s.d)){ a.deaths += s.d; a.dMatches++; }
    });
    const m = matchMvp(f); if(m && agg[m.id]) agg[m.id].mvps++;
    (Array.isArray(f.rivals) ? f.rivals : []).forEach(r=>{ if(r && agg[r.killer]) agg[r.killer].rivalMax = Math.max(agg[r.killer].rivalMax, r.n||0); else if(r && r.killer){ agg[r.killer] = { id:r.killer, kills:0, deaths:0, matches:0, dMatches:0, best:0, mvps:0, rivalMax:r.n||0 }; } });
  });
  return Object.values(agg).map(a=>({ ...a, name: memberName(a.id), team: memberTeam(a.id), kd: a.dMatches ? a.kills / Math.max(1, a.deaths) : null }))
    .filter(a=>a.team && state.teams[a.team]);
}
function computeTitles(list){
  const t = {};
  const give = (ids, key)=> ids.forEach(id=> (t[id] || (t[id] = [])).push(key));
  const maxBy = (arr, fn)=>{ if(!arr.length) return []; const m = Math.max(...arr.map(fn)); return m>0 ? arr.filter(a=>fn(a)===m).map(a=>a.id) : []; };
  give(maxBy(list, p=>p.kills), 'top');
  give(maxBy(list, p=>p.best), 'demon');
  give(maxBy(list, p=>p.mvps), 'bounty');
  const withD = list.filter(p=>p.dMatches>0 && p.matches>0);
  give(maxBy(withD, p=>p.deaths), 'sponge');
  if(withD.length >= 2){ const rate = p=>p.deaths/p.dMatches; const mn = Math.min(...withD.map(rate)); give(withD.filter(p=>rate(p)===mn).map(p=>p.id), 'ghost'); }
  give(maxBy(list, p=>p.rivalMax), 'nemesis');
  return t;
}
function titleIcons(id, map){ return ((map||{})[id] || []).map(k=>TITLES[k].icon).join(''); }

/* ---------- confetti ---------- */
function burst(){
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr; const g = c.getContext('2d'); g.scale(dpr,dpr);
  const neon = effectiveTheme()==='neon';
  const cols = neon ? ['#FF2E97','#00E5FF','#FFE45C','#39FFB0','#FFFFFF'] : ['#F80414','#ECECEC','#C9A961','#FFFFFF','#FF6B6B'];
  const parts = [];
  const spawn = (x, y, dir)=>{ for(let n=0;n<80;n++){ const spread = dir===0 ? (Math.random()-0.5)*1.4 : dir*(0.15+Math.random()*0.9); const a = -Math.PI/2 + spread, sp = 9 + Math.random()*10;
    parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: Math.random()*6.28, vr: (Math.random()-.5)*0.4,
      w: 6+Math.random()*6, h: 3+Math.random()*5, c: cols[n%cols.length], s: Math.random()<0.18 ? 'star' : (Math.random()<0.3 ? 'dot' : 'rect') }); } };
  spawn(W*0.08, H+10, 0.35); spawn(W*0.92, H+10, -0.35); spawn(W*0.5, H+10, 0);
  const t0 = performance.now(), dur = 2600;
  (function frame(t){
    const e = t - t0; g.clearRect(0,0,W,H);
    const alpha = e > dur-700 ? Math.max(0,(dur-e)/700) : 1;
    parts.forEach(p=>{ p.vy += 0.28; p.vx *= 0.99; p.vy *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.globalAlpha = alpha; g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c;
      if(p.s==='dot'){ g.beginPath(); g.arc(0,0,p.h*0.7,0,6.28); g.fill(); }
      else if(p.s==='star'){ g.beginPath(); for(let k=0;k<8;k++){ const rr = k%2 ? 2.5 : 7; g.lineTo(Math.cos(k*Math.PI/4)*rr, Math.sin(k*Math.PI/4)*rr); } g.closePath(); g.fill(); }
      else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      g.restore(); });
    if(e < dur) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function auditorVerified(){ return cloud.enabled ? !!cloud.user : !!auditorUnlocked; }

const AN = { matchIdx:null, files:[], thumbs:[], status:'idle', progress:0, text:'', conf:0, rowsSrc:[], draft:null, map:{k:0,d:1}, report:null };

/* ---------- OCR ---------- */
let tessLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!tessLoading) tessLoading = new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ()=> window.Tesseract ? res(window.Tesseract) : rej(new Error('missing'));
    s.onerror = ()=>{ tessLoading = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function prepImage(file){
  const url = URL.createObjectURL(file);
  const img = await loadImg(url); URL.revokeObjectURL(url);
  const scale = Math.min(2.5, Math.max(1, 1800/img.width));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data; let sum = 0;
  for(let k=0;k<px.length;k+=4){ const y = 0.299*px[k] + 0.587*px[k+1] + 0.114*px[k+2]; px[k] = y; sum += y; }
  const inv = (sum/(px.length/4)) < 128;   // game screens are light-on-dark; OCR prefers dark-on-light
  for(let k=0;k<px.length;k+=4){ let y = px[k]; if(inv) y = 255-y; y = (y-128)*1.7 + 128; y = y<0 ? 0 : y>255 ? 255 : y; px[k] = px[k+1] = px[k+2] = y; }
  g.putImageData(d, 0, 0);
  return c;
}
async function runOcr(files, onProgress){
  const T = await loadTesseract();
  const worker = await T.createWorker('eng', 1, { logger: m=>{ if(m && m.status==='recognizing text' && typeof m.progress==='number') onProgress(m.progress); } });
  let text = ''; const conf = [];
  for(let n=0;n<files.length;n++){
    const canvas = await prepImage(files[n]);
    const { data } = await worker.recognize(canvas);
    text += '\n' + (data.text || ''); if(typeof data.confidence==='number') conf.push(data.confidence);
  }
  await worker.terminate();
  return { text, confidence: conf.length ? conf.reduce((a,b)=>a+b,0)/conf.length : 0 };
}

/* ---------- parsing ---------- */
function normKey(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g,''); }
function bigrams(s){ const out = []; for(let k=0;k<s.length-1;k++) out.push(s.slice(k,k+2)); return out; }
function dice(a, b){
  if(!a || !b) return 0; if(a===b) return 1; if(a.length<2 || b.length<2) return 0;
  const A = bigrams(a), B = bigrams(b).slice(); let hit = 0;
  A.forEach(x=>{ const i = B.indexOf(x); if(i>-1){ hit++; B.splice(i,1); } });
  return 2*hit/(A.length + bigrams(b).length);
}
function nameScore(name, hay){
  const n = normKey(name); if(n.length<2 || !hay) return 0;
  if(hay.includes(n)) return 1;
  let best = 0;
  for(let len=Math.max(2,n.length-1); len<=n.length+1; len++)
    for(let k=0; k+len<=hay.length; k++) best = Math.max(best, dice(n, hay.slice(k,k+len)));
  return best;
}
function parseLines(text){
  return String(text).split(/\n+/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const nums = [], words = [], hasDigit = /\d/.test(line);
    const isScore = /\b\d{1,2}\s*[:\-–]\s*\d{1,2}\b/.test(line);
    line.split(/\s+/).forEach(t=>{
      let fixed = t.replace(/[.,:;]+$/,'');
      if(hasDigit && /^[Oo]$/.test(fixed)) fixed = '0';
      if(/\d/.test(fixed)) fixed = fixed.replace(/[Oo]/g,'0').replace(/[lI|!]/g,'1').replace(/[Ss]/g,'5');
      if(/^\d{1,5}$/.test(fixed)) nums.push(parseInt(fixed,10)); else words.push(t);
    });
    return { line, key: normKey(words.join('')), nums, small: nums.filter(v=>v<=99), isScore };
  });
}
function parseMatch(text, members){
  const rows = parseLines(text);
  const used = new Set(), matched = {};
  members.map(m=>{
    let best = -1, sc = 0;
    rows.forEach((r,ri)=>{ if(used.has(ri) || !r.small.length || r.isScore) return;
      const s = nameScore(m.name, r.key) - Math.max(0, r.key.length - normKey(m.name).length)*0.004;
      if(s>sc){ sc = s; best = ri; } });
    return { m, best, sc };
  }).sort((a,b)=>b.sc-a.sc).forEach(({m,best,sc})=>{
    if(best>-1 && sc>=0.55 && !used.has(best)){ used.add(best); matched[m.id] = { row: rows[best], score: sc }; }
  });
  const unmatched = rows.filter((r,ri)=>!used.has(ri) && !r.isScore && r.small.length && r.key.length>=2);
  let rounds = null;
  const rm = String(text).match(/\b(\d{1,2})\s*[:\-–]\s*(\d{1,2})\b/);
  if(rm) rounds = [parseInt(rm[1],10), parseInt(rm[2],10)];
  return { matched, unmatched, rounds };
}
function statFrom(row){ const s = row.small; return { k: Number.isFinite(s[AN.map.k]) ? s[AN.map.k] : '', d: AN.map.d>=0 && Number.isFinite(s[AN.map.d]) ? s[AN.map.d] : '' }; }
function anMembers(i){ const f = state.fixtures[i]; return [f.home, f.away].flatMap(k=>rosterMembers(k).map(m=>({ ...m, team:k }))); }
function buildDraft(i, parsed){
  const f = state.fixtures[i], fmt = fixtureFormat(i);
  const d = { total: f.played && f.rounds ? f.rounds : fmt.rounds, hr: f.played ? f.homeRounds : '', ar: f.played ? f.awayRounds : '', rows:{}, unmatched:[] };
  anMembers(i).forEach(m=>{ const s = f.stats && f.stats[m.id]; d.rows[m.id] = { k: s && Number.isFinite(s.k) ? s.k : '', d: s && Number.isFinite(s.d) ? s.d : '', src:'', score:0 }; });
  if(parsed){
    Object.entries(parsed.matched).forEach(([id, x])=>{ const v = statFrom(x.row); d.rows[id] = { ...v, src: x.row.line, score: x.score, row: x.row }; });
    d.unmatched = parsed.unmatched;
    if(parsed.rounds && !f.played){ d.hr = parsed.rounds[0]; d.ar = parsed.rounds[1]; }
  }
  return d;
}

/* ---------- actions ---------- */
async function anScan(){
  if(AN.matchIdx===null){ toast('Pick a match first'); return; }
  if(!AN.files.length){ toast('Add a screenshot first'); return; }
  AN.status = 'scanning'; AN.progress = 0; renderAnalyticsOnly();
  try{
    const out = await runOcr(AN.files, p=>{ AN.progress = p; const bar = document.getElementById('anBar'); if(bar) bar.style.width = Math.round(p*100)+'%'; });
    AN.text = out.text; AN.conf = out.confidence;
    const parsed = parseMatch(out.text, anMembers(AN.matchIdx));
    AN.draft = buildDraft(AN.matchIdx, parsed);
    AN.status = 'review';
    const found = Object.keys(parsed.matched).length;
    toast(found ? 'Found '+found+' player'+(found>1?'s':'')+'. Check the numbers, then save' : "Couldn't read any names. Type the numbers in below");
  }catch(e){
    AN.draft = buildDraft(AN.matchIdx, null); AN.status = 'review'; AN.conf = 0;
    toast('Scanning needs your live website and an internet connection. You can type the numbers in instead');
  }
  renderAnalyticsOnly();
}
function anManual(){
  if(AN.matchIdx===null){ toast('Pick a match first'); return; }
  AN.draft = buildDraft(AN.matchIdx, null); AN.status = 'review'; AN.conf = 0; AN.text = ''; renderAnalyticsOnly();
}
function anSave(){
  const i = AN.matchIdx, f = state.fixtures[i], d = AN.draft;
  if(!d) return;
  const num = v=> v==='' || v===null || v===undefined ? NaN : Number(v);
  const total = num(d.total), hr = num(d.hr), ar = num(d.ar);
  const hasScore = Number.isFinite(hr) && Number.isFinite(ar);
  if(hasScore){
    const v = validateFixture(total, hr, ar);
    if(v.err){ toast(v.err); return; }
    Object.assign(f, { rounds:total, homeRounds:hr, awayRounds:ar, played:true, winner: hr>ar ? f.home : f.away, forfeit:null });
  } else if(!f.played){ toast('Enter the round score for both teams'); return; }
  const stats = {};
  Object.entries(d.rows).forEach(([id, r])=>{
    const k = num(r.k), dd = num(r.d);
    if(Number.isFinite(k) || Number.isFinite(dd)){ stats[id] = {}; if(Number.isFinite(k)) stats[id].k = Math.max(0, Math.round(k)); if(Number.isFinite(dd)) stats[id].d = Math.max(0, Math.round(dd)); }
  });
  f.stats = Object.keys(stats).length ? stats : f.stats || null;
  f.audit = { at: Date.now(), by: cloud.user && cloud.user.email ? cloud.user.email : 'PIN', source: AN.text ? 'screenshot' : 'manual', files: AN.files.length, ocr: AN.text ? Math.round(AN.conf) : null };
  saveState();
  AN.report = i; AN.status = 'saved';
  render();
  const m = matchMvp(f);
  toast('Match '+(i+1)+' audited'+(m ? '. MVP: '+m.name : ''));
}
function anReset(keepMatch){
  AN.thumbs.forEach(u=>URL.revokeObjectURL(u));
  Object.assign(AN, { files:[], thumbs:[], status:'idle', progress:0, text:'', conf:0, draft:null, report:null });
  if(!keepMatch) AN.matchIdx = null;
  renderAnalyticsOnly();
}

/* ---------- analytics maths ---------- */
function teamAnalytics(){
  const st = standingsTable(); const by = Object.fromEntries(st.map(r=>[r.name, { ...r, kills:0, deaths:0, kMatches:0 }]));
  state.fixtures.forEach(f=>{
    if(!f.played || !f.stats) return;
    const seen = {};
    Object.entries(f.stats).forEach(([id,s])=>{ const t = memberTeam(id); if(!by[t]) return;
      if(Number.isFinite(s.k)) by[t].kills += s.k; if(Number.isFinite(s.d)) by[t].deaths += s.d; seen[t] = true; });
    Object.keys(seen).forEach(t=> by[t].kMatches++);
  });
  return st.map(r=>by[r.name]);
}
function killSeries(id){ return state.fixtures.map(f=> f.played && f.stats && f.stats[id] && Number.isFinite(f.stats[id].k) ? f.stats[id].k : null).filter(v=>v!==null); }
function spark(vals){
  if(vals.length<2) return '<span class="spark-none">·</span>';
  const W=64, H=20, mx = Math.max(...vals,1), mn = Math.min(...vals,0);
  const pts = vals.map((v,k)=> (k*(W-4)/(vals.length-1)+2).toFixed(1)+','+(H-2-(v-mn)*(H-4)/Math.max(1,mx-mn)).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}
function trendChart(){
  const played = state.fixtures.map((f,i)=>({f,i})).filter(x=>x.f.played);
  if(played.length<1) return '<div class="empty-state">Trends appear after the first result.</div>';
  const cum = Object.fromEntries(LEADER_KEYS.map(k=>[k,[0]]));
  played.forEach(({f})=>{ const p = fixturePoints(f); LEADER_KEYS.forEach(k=>{ const a = cum[k]; const add = k===f.home ? p.home : k===f.away ? p.away : 0; a.push(a[a.length-1] + add); }); });
  const W=640, H=230, P={l:40,r:14,t:14,b:28}, n = played.length+1;
  const mx = Math.max(10, ...LEADER_KEYS.map(k=>cum[k][n-1]));
  const x = k=> P.l + k*(W-P.l-P.r)/Math.max(1,n-1), y = v=> H-P.b - v*(H-P.t-P.b)/mx;
  let g = '';
  for(let t=0;t<=4;t++){ const v = Math.round(mx*t/4); g += `<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="gt" x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  played.forEach(({i},k)=>{ g += `<text class="gt" x="${x(k+1)}" y="${H-8}" text-anchor="middle">M${i+1}</text>`; });
  const lines = LEADER_KEYS.map(k=>`<polyline class="ln" style="stroke:${teamColor(k)}" points="${cum[k].map((v,j)=>x(j).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/><circle cx="${x(n-1)}" cy="${y(cum[k][n-1])}" r="4" style="fill:${teamColor(k)}"/>`).join('');
  const legend = LEADER_KEYS.map(k=>`<span><i style="background:${teamColor(k)}"></i>${esc(L(k))} ${cum[k][n-1]}</span>`).join('');
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points per team after each match">${g}${lines}</svg></div><div class="legend">${legend}</div>`;
}

async function anCsv(){

  teamAnalytics().forEach(t=> lines.push([teamName(t.name), L(t.name), t.played, t.won, t.lost, t.played ? Math.round(100*t.won/t.played) : '', t.rw, t.rl, t.diff, t.kills, t.deaths, t.points].map(q).join(',')));
  lines.push('', 'PLAYERS', ['Player','Team','Matches','Kills','Avg kills','Best','Deaths','K/D','MVPs'].map(q).join(','));
  playerStats().sort((a,b)=>b.kills-a.kills).forEach(p=> lines.push([p.name, L(p.team), p.matches, p.kills, p.matches ? (p.kills/p.matches).toFixed(2) : '', p.best, p.dMatches ? p.deaths : '', p.kd!==null ? p.kd.toFixed(2) : '', p.mvps].map(q).join(',')));
  lines.push('', 'MATCHES', ['Match','Home','Away','Home rounds','Away rounds','Winner','Source','Recorded by','When'].map(q).join(','));
  state.fixtures.forEach((f,i)=>{ if(!f.played) return; const a = f.audit; lines.push(['M'+(i+1), L(f.home), L(f.away), f.homeRounds, f.awayRounds, L(f.winner), a ? a.source : (f.stats ? 'manual' : 'score only'), a ? a.by : '', a ? new Date(a.at).toISOString() : ''].map(q).join(',')); });
  const blob = new Blob([lines.join('\n')], { type:'text/csv' });
  if(window.claude && typeof window.claude.use==='function'){ try{ const dl = await window.claude.use('downloads'); if(dl){ await dl.save({ filename:'apex_audit_report.csv', data:blob }); return; } }catch(e){} }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'apex_audit_report.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast('Report downloaded');
}

async function prepareProfilePhoto(file){
  if(!file || (!/^image\//i.test(file.type) && !(file.type==='' && /\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(file.name))))
    throw new Error('Choose an image from your gallery.');
  if(!file.size) throw new Error('This image is empty. Choose another photo.');
  if(file.size>15*1024*1024) throw new Error('Photo must be 15 MB or smaller.');
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImg(url);
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    if(!side) throw new Error('Invalid image');
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 384;
    const g = canvas.getContext('2d');
    g.fillStyle = '#141418'; g.fillRect(0,0,384,384);
    g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,384,384);
    const photo = canvas.toDataURL('image/jpeg',0.84);
    if(!photo.startsWith('data:image/jpeg;base64,') || photo.length>245760) throw new Error('Image too large');
    return photo;
  }catch(e){
    throw new Error('Could not read this photo. Try a JPG, PNG or WebP image.');
  }finally{ URL.revokeObjectURL(url); }
}

function pathGet(obj, parts){ return parts.reduce((o,k)=> o==null ? undefined : o[k], obj); }
function pathSet(obj, parts, val){
  let o = obj; for(let k=0;k<parts.length-1;k++){ if(o[parts[k]]==null || typeof o[parts[k]]!=='object') o[parts[k]] = {}; o = o[parts[k]]; }
  const last = parts[parts.length-1];
  if(val===null || val===undefined) delete o[last]; else o[last] = val;
}
const soc = {
  ref(p){ return firebase.database().ref('social/'+p); },
  id(){ return S.cloud ? firebase.database().ref('social/posts').push().key : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); },
  async set(p, val){
    if(S.cloud){ await soc.ref(p).set(val===undefined ? null : val); return; }
    pathSet(LOC, p.split('/'), val); if(p.startsWith('media/')) mediaCache[p.slice(6)] = val; socLocalChanged();
  },
  async update(p, obj){
    if(S.cloud){ await soc.ref(p).update(obj); return; }
    Object.entries(obj).forEach(([k,v])=> pathSet(LOC, (p ? p.split('/') : []).concat(k.split('/')), v)); socLocalChanged();
  },
  async add(p, val){ const k = soc.id(); await soc.set(p+'/'+k, val); return k; },
  async inc(p, by){
    if(S.cloud){ await soc.ref(p).transaction(v=> (v||0) + by); return; }
    const parts = p.split('/'); pathSet(LOC, parts, (pathGet(LOC, parts)||0) + by); socLocalChanged();
  },
  async media(pid){
    if(mediaCache[pid]) return mediaCache[pid];
    if(!S.cloud) return null;
    if(!mediaLoading[pid]) mediaLoading[pid] = soc.ref('media/'+pid).once('value').then(s=>{ mediaCache[pid] = s.val(); return mediaCache[pid]; });
    return mediaLoading[pid];
  }
};

/* ---------- media: filters & frames ---------- */
const FILTERS = { none:'Original', ghost:'Ghost Noir', crimson:'Crimson', neon:'Neon', gold:'Gold Hour', frost:'Frost' };
const FRAMES = { none:'No frame', apex:'Apex Red', gold:'Champion Gold', neon:'Arcade Neon', ghost:'Ghost Mark' };
function pixelFilter(g, w, h, f){
  if(f==='none') return;
  const d = g.getImageData(0,0,w,h), p = d.data;
  for(let k=0;k<p.length;k+=4){
    let r = p[k], gg = p[k+1], b = p[k+2]; const y = 0.299*r + 0.587*gg + 0.114*b;
    if(f==='ghost'){ const c = (y-128)*1.3+128; r = c*0.96; gg = c*0.98; b = c*1.06; }
    else if(f==='crimson'){ const c = (y-128)*1.2+128; r = c*1.18+18; gg = c*0.72; b = c*0.72; }
    else if(f==='neon'){ r = r*1.1 + (b>gg?25:0); gg = gg*0.88; b = b*1.2 + (r>gg?20:0); }
    else if(f==='gold'){ r = y*1.08+30; gg = y*0.95+14; b = y*0.7; }
    else if(f==='frost'){ r = r*0.9; gg = gg*1.0+6; b = b*1.12+18; }
    p[k] = r<0?0:r>255?255:r; p[k+1] = gg<0?0:gg>255?255:gg; p[k+2] = b<0?0:b>255?255:b;
  }
  g.putImageData(d,0,0);
}
async function drawFrame(g, w, h, fr){
  if(fr==='none') return;
  const t = Math.round(Math.min(w,h)*0.035);
  let logo = null; try{ logo = await loadImg(LOGO_ICON_SRC); }catch(e){}
  if(fr==='apex'){ g.lineWidth = t; g.strokeStyle = '#F80414'; g.strokeRect(t/2,t/2,w-t,h-t);
    g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(t, h-t*3.4, w-2*t, t*2.4);
    g.fillStyle = '#ECECEC'; g.font = `800 ${Math.round(t*1.25)}px "Saira Condensed","Arial Narrow",sans-serif`; g.fillText('APEX SOCIAL', t*2.4, h-t*1.7);
    if(logo) g.drawImage(logo, w-t*3.6, h-t*3.2, t*2, t*2*logo.height/logo.width); }
  if(fr==='gold'){ g.strokeStyle = '#C9A961'; g.lineWidth = t*0.6; g.strokeRect(t*0.5,t*0.5,w-t,h-t); g.lineWidth = t*0.18; g.strokeRect(t*1.4,t*1.4,w-t*2.8,h-t*2.8); }
  if(fr==='neon'){ const gr = g.createLinearGradient(0,0,w,h); gr.addColorStop(0,'#00E5FF'); gr.addColorStop(1,'#FF2E97'); g.strokeStyle = gr; g.lineWidth = t; g.shadowColor = '#FF2E97'; g.shadowBlur = t*1.2; g.strokeRect(t,t,w-2*t,h-2*t); g.shadowBlur = 0; }
  if(fr==='ghost'){ const vg = g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.3,w/2,h/2,Math.max(w,h)*0.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.65)'); g.fillStyle = vg; g.fillRect(0,0,w,h);
    if(logo){ const lw = w*0.18; g.globalAlpha = 0.55; g.drawImage(logo, w-lw-t, t, lw, lw*logo.height/logo.width); g.globalAlpha = 1; } }
}
async function bakeImage(src, filter, frame){
  const img = await loadImg(src);
  const maxW = 1080, sc = Math.min(1, maxW/img.width);
  const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.drawImage(img, 0, 0, w, h); pixelFilter(g, w, h, filter); await drawFrame(g, w, h, frame);
  return c.toDataURL('image/jpeg', 0.8);
}
function readFileURL(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function videoDuration(url){ return new Promise(res=>{ const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = ()=>res(v.duration||0); v.onerror = ()=>res(0); v.src = url; }); }
async function pickMedia(file){
  const C = S.composer;
  if(/^image\//.test(file.type)){
    C.type = 'image'; C.raw = await readFileURL(file); C.media = await bakeImage(C.raw, C.filter, C.frame);
  } else if(/^video\//.test(file.type)){
    if(file.size > 4.5*1024*1024){ toast('Clips must be under 4.5 MB'); return; }
    const url = await readFileURL(file); const dur = await videoDuration(url);

    C.type = 'video'; C.raw = url; C.media = url;

/* ---------- guest sign-in ---------- */
async function socGuestSignIn(){
  if(!S.cloud || !cloud.auth) return true;
  if(cloud.authUser) return true;
  try{ await cloud.auth.signInAnonymously(); S.authErr = null; return true; }
  catch(e){ S.authErr = String((e && e.code) || 'error'); return false; }
}
function socAuthProblem(){
  if(!S.authErr) return '';
  if(/operation-not-allowed|admin-restricted/.test(S.authErr)) return 'Guest sign-up is switched off. The host needs to turn on Anonymous sign-in in Firebase (Authentication, Sign-in method).';
  if(/network/.test(S.authErr)) return "Can't reach the server. Check this phone's internet connection and try again.";
  return "Couldn't start a session on this phone ("+S.authErr+"). Refresh the page and try again.";
}

function nameTaken(n){ return Object.values(S.users).some(u=>u && u.uid!==S.me && u.name===n) || Object.values(NPC_USERS).some(u=>u.name===n); }
function takenMsg(n){ return n+' is already taken. Each phone is a separate account, so pick a different name here.'; }

/* ---------- onboarding & avatar builder ---------- */
function openOnboarding(editOnly){
  const me = myUser();
  const draft = { name: me ? me.name : '', avatar: Object.assign(defaultAvatar(), me ? me.avatar : randomAvatar()), photo: me ? (me.photo || null) : null, bio: me ? (me.bio || '') : '' };
  const editingUid = S.me;
  let photoBusy = false, saveBusy = false, photoError = '';
  let step = editOnly ? 2 : 1;
  const modal = openModal('<div id="obWrap"></div>');
  modal.classList.add('modal-full');
  const draw = ()=>{
    const wrap = modal.querySelector('#obWrap');
    if(step===1){
      const valid = /^[A-Z]{3,16}$/.test(draft.name);
      const taken = valid && nameTaken(draft.name);
      wrap.innerHTML = `<div class="ob">
        <img class="ob-logo" src="${LOGO_ICON_SRC}" alt="">
        <p class="ob-kick">APEX SOCIAL</p>
        <h2 class="ob-title">JOIN WITH YOUR IN-GAME NAME</h2>
        <input class="ob-name" id="obName" maxlength="16" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="next" value="${esc(draft.name)}" placeholder="WAXXY" aria-label="In-game name">
        <p class="ob-rule ${(draft.name && !valid) || taken ? 'bad' : ''}">${taken ? takenMsg(draft.name) : NAME_RULE}</p>
        <p class="ob-err" id="obWarn" role="alert">${socAuthProblem()}</p>
        <div class="btn-row ob-actions"><button class="btn btn-red" id="obNext" ${valid && !taken ? '' : 'disabled'}>Next: build your avatar</button><button class="btn" data-close>Just look around</button></div>
      </div>`;
      const inp = wrap.querySelector('#obName'), next = wrap.querySelector('#obNext'), rule = wrap.querySelector('.ob-rule');
      const cleanOf = v=> String(v).toUpperCase().replace(/[^A-Z]/g,'').slice(0,16);
      const judge = v=>{ const ok = /^[A-Z]{3,16}$/.test(v), tk = ok && nameTaken(v);
        next.disabled = !ok || tk; rule.textContent = tk ? takenMsg(v) : NAME_RULE; rule.classList.toggle('bad', !!v && (!ok || tk)); return ok && !tk; };
      const commit = ()=>{ const pos = inp.selectionStart || 0, raw = inp.value, clean = cleanOf(raw);
        if(raw!==clean){ inp.value = clean; const p2 = Math.max(0, pos - (raw.length-clean.length)); try{ inp.setSelectionRange(p2,p2); }catch(e){} }
        draft.name = clean; return judge(clean); };
      inp.addEventListener('compositionstart', ()=>{ inp._comp = true; });
      inp.addEventListener('compositionend', ()=>{ inp._comp = false; commit(); });
      inp.oninput = e=>{ if(e.isComposing || inp._comp){ draft.name = cleanOf(inp.value); judge(draft.name); return; } commit(); };
      inp.onblur = ()=> commit();
      const go = ()=>{ if(commit()){ step = 2; draw(); } };
      inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
      next.onclick = go;
      if(S.cloud && !cloud.authUser) socGuestSignIn().then(()=>{ const w = wrap.querySelector('#obWarn'); if(w) w.textContent = socAuthProblem(); });
      setTimeout(()=>inp.focus(), 50);
    } else {
      const row = (key, label, arr)=>`<div class="avb-row"><span>${label}</span><div class="avb-step"><button class="icon-x" data-av="${key}" data-dir="-1" aria-label="Previous ${label}">‹</button><b>${arr[draft.avatar[key] % arr.length]}</b><button class="icon-x" data-av="${key}" data-dir="1" aria-label="Next ${label}">›</button></div></div>`;
      const sw = (key, label, arr)=>`<div class="avb-row"><span>${label}</span><div class="avb-sw">${arr.map((c,k)=>`<button class="sw ${draft.avatar[key]===k?'on':''}" style="background:${c}" data-avs="${key}" data-k="${k}" aria-label="${label} ${k+1}"></button>`).join('')}</div></div>`;
      wrap.innerHTML = `<div class="ob">
        <p class="ob-kick">${editOnly ? 'EDIT PROFILE' : 'STEP 2 OF 2'}</p>
        <h2 class="ob-title">${esc(draft.name || (me && me.name) || '')}</h2>
        <div class="avb">
          <div class="avb-prev">${socialAvatarHTML(draft, 168)}
            <button class="btn btn-sm btn-red" id="avChoosePhoto">${photoBusy ? 'Loading photo…' : 'Choose from gallery'}</button>

        </div>
        <label class="ag-bio-label">Bio<textarea class="in" id="agBio" maxlength="160" placeholder="Your squad, your game, your vibe">${esc(draft.bio)}</textarea></label>
        <p class="ob-err" id="obErr" role="alert">${esc(photoError)}</p>

      </div>`;

      wrap.querySelectorAll('[data-avs]').forEach(b=> b.onclick = ()=>{ draft.avatar[b.dataset.avs] = +b.dataset.k; draw(); });

        const file = photoInput.files && photoInput.files[0];
        if(!file || photoBusy || saveBusy) return;
        photoBusy = true; photoError = ''; draw();
        try{ draft.photo = await prepareProfilePhoto(file); }
        catch(e){ photoError = e.message; }
        finally{ photoBusy = false; if(modal.isConnected) draw(); }
      };
      const back = wrap.querySelector('#obBack'); if(back) back.onclick = ()=>{ step = 1; draw(); };
      wrap.querySelector('#obJoin').onclick = async ()=>{
        if(photoBusy || saveBusy) return;
        saveBusy = true;
        try{
          if(editOnly){
            if(!editingUid || S.me!==editingUid || !myUser()) throw new Error('Profile session changed.');
            photoError = ''; draw();
            await soc.update(`users/${editingUid}`, { avatar:draft.avatar, photo:draft.photo, bio:draft.bio });
            if(modal.isConnected) closeModal();
            toast('Profile saved'); renderSocial(true); return;

          const fail = m=>{ if(errEl) errEl.textContent = m; jb.disabled = false; jb.textContent = 'Join APEX SOCIAL'; };
          if(errEl) errEl.textContent = '';
          if(S.cloud && !S.me){
            jb.disabled = true; jb.textContent = 'Connecting…';
            const ok = await socGuestSignIn();
            for(let k=0; k<30 && ok && !S.me; k++) await new Promise(r=>setTimeout(r,150));
            if(!S.me) return fail(socAuthProblem() || "Still connecting. Check this phone's internet and try again.");
          }
          if(nameTaken(draft.name)){ step = 1; draw(); return; }
          jb.disabled = true; jb.textContent = 'Joining…';
          await soc.set('users/'+S.me, { uid:S.me, name:draft.name, avatar:draft.avatar, photo:draft.photo, bio:draft.bio, botFollowers:0, createdAt:Date.now(), lastActive:Date.now(), notifSeen:Date.now() });
          closeModal(); burst(); toast('Welcome to APEX SOCIAL, '+draft.name+'!');
          S.view = 'feed'; renderSocial(true);
        }catch(e){
          const code = String((e && (e.code || e.message)) || '');
          const errEl = wrap.querySelector('#obErr'), jb = wrap.querySelector('#obJoin');
          if(editOnly){
            photoError = /permission/i.test(code) ? 'Photo save blocked by database rules. Check your sign-in and APEX SOCIAL rules.' : "Couldn't save profile picture. Check your connection and sign-in, then retry.";
            return;
          }
          if(errEl) errEl.textContent = /permission/i.test(code)
            ? 'Sign-ups are being blocked by the database rules. The host needs to publish the APEX SOCIAL rules in Firebase (Realtime Database, Rules).'
            : "Couldn't join. Check this phone's internet connection and try again.";
          if(jb){ jb.disabled = false; jb.textContent = editOnly ? 'Save profile' : 'Join APEX SOCIAL'; }
        }finally{
          saveBusy = false;
          if(editOnly && modal.isConnected) draw();
        }
      };
      if(photoBusy || saveBusy){
        wrap.querySelectorAll('button,input,textarea').forEach(el=>{ el.disabled = true; });
        wrap.querySelector('#obJoin').textContent = photoBusy ? 'Loading photo…' : 'Saving…';
      }
    }
  };
  draw();
}

      if(S.me===uid) return; S.me = uid; S.notifs = {}; S.lastNotifAt = 0;

}

/* =========================================================
   3D LEADER MASCOT BADGES
========================================================= */
function makeGeometry(type){
  switch(type){
    case 'octa': return new THREE.OctahedronGeometry(1, 0);
    case 'dodeca': return new THREE.DodecahedronGeometry(0.9, 0);
    case 'torus': return new THREE.TorusGeometry(0.68, 0.26, 16, 48);
    default: return new THREE.IcosahedronGeometry(1, 0);
  }
}
let mascotObjs = {};
function refreshMascots(){
  Object.keys(mascotObjs).forEach(k=>{
    const o = mascotObjs[k], sig = (prof(k).color||'')+'|'+mascotGeo(k);
    if(o.sig===sig) return;
    o.sig = sig;
    try{
      o.mat.color.set(prof(k).color || TEAMS_META[k].mascotColor);
      o.mat.flatShading = mascotGeo(k)!=='torus'; o.mat.needsUpdate = true;
      o.mesh.geometry.dispose(); o.mesh.geometry = makeGeometry(mascotGeo(k));
    }catch(e){}
  });
}
function initMascots(){
  if(typeof THREE === 'undefined'){ document.body.classList.add('no-3d'); return; }
  const mascots = LEADER_KEYS.map(name=>{
    const canvas = document.getElementById('mascot-'+name);
    if(!canvas) return null;
    const meta = TEAMS_META[name];
    try{
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10);
      camera.position.set(0,0,3);
      const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(18,18,false);
      const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2.2,2.4,3); scene.add(key);
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const mat = new THREE.MeshStandardMaterial({ color: prof(name).color || meta.mascotColor, flatShading: mascotGeo(name)!=='torus', metalness:0.4, roughness:0.3 });
      const mesh = new THREE.Mesh(makeGeometry(mascotGeo(name)), mat);
      mascotObjs[name] = { mesh, mat, sig: (prof(name).color||'')+'|'+mascotGeo(name) };
      scene.add(mesh);
      return { renderer, scene, camera, mesh };
    }catch(e){ const w = canvas.closest('.lt-mascot'); if(w) w.style.display='none'; return null; }
  }).filter(Boolean);
  (function loop(){
    mascots.forEach(m=>{ m.mesh.rotation.x += 0.007; m.mesh.rotation.y += 0.014; m.renderer.render(m.scene, m.camera); });
    requestAnimationFrame(loop);
  })();
}

    const t = state.teams[name];
    el.style.setProperty('--team', teamColor(name));
    const img = el.querySelector('[data-f="img"]'); const src = teamPhoto(name); if(img.getAttribute('src')!==src) img.setAttribute('src', src);
    el.querySelector('[data-f="name"]').textContent = L(name);
    el.querySelector('[data-f="nick"]').textContent = shortNick(name);
    el.querySelector('[data-f="purse"]').textContent = t.purse;
    el.querySelector('[data-f="money"]').textContent = money(t.purse);
    const filled = t.roster.length;
    let pips = '';
    for(let i=0;i<squadSize();i++) pips += `<i class="${i===0 ? 'cap' : (i<filled ? 'on' : '')}"></i>`;
    const pe = el.querySelector('[data-f="pips"]');
    pe.innerHTML = pips;
    pe.setAttribute('aria-label', filled+' of '+squadSize()+' players');
    el.classList.toggle('is-leading', !!(state.currentBid && state.currentBid.team===name));
    el.classList.toggle('is-short', shortBy(name)>0);
  });
  refreshMascots();
}
function auditorPage(){
  return `<div class="aud-wrap"><div class="page-head"><h1>Auditor</h1><p>${cloud.enabled && !cloud.user ? 'Host sign-in.' : 'Master controls for teams, points, prices, formats and backups.'}</p></div>${auditorHTML()}</div>`;
}
function syncDock(){
  const active = document.querySelector('.view.active');
  const on = !!(active && active.id==='auction' && isAdmin() && document.querySelector('#auction .dock'));
  document.body.classList.toggle('dock-on', on);
}

const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';

/* =========================================================
   INIT
========================================================= */
(function init(){
  let saved = loadState();
  if(saved && (saved.dataRev || 0) < DATA_REV){
    try{ localStorage.setItem(STORAGE_KEY+'-before-rev'+DATA_REV, localStorage.getItem(STORAGE_KEY)); }catch(e){}
    saved = null;
  }
  state = saved || migrate(snapshotState());
  state.dataRev = DATA_REV;
  applyConfig();
  document.getElementById('lockupMark').src = LOGO_ICON_SRC;
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ try{ if(document.fonts.check('800 40px "Saira Condensed"')) document.documentElement.classList.add('saira'); }catch(e){} }); }
  applyTheme();
  document.getElementById('leaderStrip').innerHTML = leaderStripHTML();
  initMascots();
  saveState();
  render();
  initCloud();
  const socialLink = new URLSearchParams(window.location.search);
  const sharedProfile = socialLink.get('apexProfile'), sharedPost = socialLink.get('apexPost');
  if(sharedProfile || sharedPost){
    S.onboardShown = true;
    if(sharedPost){ S.detailId = sharedPost; S.view = 'post'; }
    else { S.profileUid = sharedProfile; S.view = 'profile'; }
    switchTab('social');
  }
})();
</script>
