<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX GAMING — Draft Auction</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

/* ---------- tokens (colours sampled from the Apex Gaming logo) ---------- */
:root{
  --ink:#000000; --carbon:#0E0E10; --graphite:#17171A; --raise:#1F1F23;
  --line:#26262B; --line-2:#1B1B1F;
  --silver:#ECECEC; --steel:#8A8A93; --dim:#4A4A52;
  --red:#F80414; --ember:#B8030F; --red-ghost:rgba(248,4,20,.10);
  --champ:#C9A961; --signal:#3DDC97;
  --on-red:#FFFFFF;
  --display:'Saira Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --ui:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:4px; --r-lg:8px;
  /* aliases used by older markup */
  --bg:var(--ink); --panel:var(--carbon); --text:var(--silver); --muted:var(--steel); --border:var(--line);
  --crimson:var(--red); --gold:var(--champ); --success:var(--signal);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --ink:#F3F3F4; --carbon:#FFFFFF; --graphite:#F4F4F6; --raise:#EBEBEE;
    --line:#E0E0E5; --line-2:#EDEDF0; --silver:#0E0E10; --steel:#62626B; --dim:#B9B9C0;
    --champ:#A88A45; --signal:#1E9E68; --red-ghost:rgba(248,4,20,.06);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ink:#F3F3F4; --carbon:#FFFFFF; --graphite:#F4F4F6; --raise:#EBEBEE;
  --line:#E0E0E5; --line-2:#EDEDF0; --silver:#0E0E10; --steel:#62626B; --dim:#B9B9C0;
  --champ:#A88A45; --signal:#1E9E68; --red-ghost:rgba(248,4,20,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#000000; --carbon:#0E0E10; --graphite:#17171A; --raise:#1F1F23;
  --line:#26262B; --line-2:#1B1B1F; --silver:#ECECEC; --steel:#8A8A93; --dim:#4A4A52;
  --champ:#C9A961; --signal:#3DDC97; --red-ghost:rgba(248,4,20,.10);
  color-scheme:dark;
}
html{ scroll-padding-top:calc(120px + env(safe-area-inset-top,0px)); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{background-color:var(--ink);background-image:radial-gradient(ellipse 90% 45% at 50% -10%,rgba(248,4,20,0.12),transparent 75%),radial-gradient(ellipse 60% 40% at 85% 100%,rgba(0,210,255,0.06),transparent 80%),radial-gradient(circle at 10% 50%,rgba(139,92,246,0.04),transparent 60%);background-attachment:fixed;color:var(--silver);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body{padding-bottom:56px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.35}
input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){ .masthead{background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)} }
.mh-inner{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand tools" "tabs tabs";align-items:center;column-gap:12px}
.lockup{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0}
.lockup-mark{width:30px;height:30px;object-fit:contain}
[data-theme="light"] .lockup-mark{filter:invert(1) hue-rotate(180deg) saturate(1.4)}
.lockup-text{display:flex;flex-direction:column;line-height:1}
.lockup-apex{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.16em}
.lockup-gaming{font-weight:700;font-size:7.5px;letter-spacing:.66em;color:var(--red);margin-top:4px;padding-left:1px}
.mh-tools{grid-area:tools;display:flex;align-items:center;gap:8px}
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:999px){ .tabs{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:40px} }
.tab{position:relative;padding:10px 12px 13px;font-size:13.5px;font-weight:500;color:var(--steel);white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--silver)}
.tab.active{color:var(--silver)}
.tab.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--red);transform:skewX(-28deg)}
@media (min-width:1000px){
  .mh-inner{grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs tools";padding:0 24px}
  .tabs{margin:0;padding:0;justify-content:center;gap:6px}
  .tab{padding:23px 14px 24px}
}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--steel);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--signal);flex-shrink:0}
.pill.live{color:var(--silver);border-color:rgba(248,4,20,.55)}
.pill.live i{background:var(--red);animation:livepulse 1.6s infinite}
.pill.warn{color:var(--red)} .pill.warn i{background:var(--red)}
.pill.off i{background:var(--dim)}
button.pill:hover{border-color:var(--steel);color:var(--silver)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;color:var(--steel)}
.icon-btn:hover{color:var(--silver);border-color:var(--steel)}
.icon-btn svg{width:15px;height:15px}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(248,4,20,.55)}70%{box-shadow:0 0 0 7px rgba(248,4,20,0)}100%{box-shadow:0 0 0 0 rgba(248,4,20,0)}}

/* ---------- leader band (persistent scoreboard) ---------- */
.leader-band{max-width:1200px;margin:0 auto;padding:16px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:760px){ .leader-band{grid-template-columns:repeat(4,1fr);gap:12px;padding:22px 24px 0} }
.lt{position:relative;display:flex;gap:12px;padding:10px 12px 10px 10px;background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:border-color .2s}
.lt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--team)}
.lt.is-leading{border-color:var(--red)}
.lt-photo-wrap{position:relative;flex:0 0 50px;margin-left:4px;align-self:flex-start}
.lt-photo{width:50px;height:66px;border-radius:3px}
.lt-mascot{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;background:var(--carbon);border:2px solid var(--carbon);display:grid;place-items:center;z-index:2}
.lt-mascot canvas{width:18px;height:18px;display:block}
body.no-3d .lt-mascot{display:none}
.lt-body{min-width:0;flex:1;display:flex;flex-direction:column}
.lt-name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05}
.lt-nick{font-size:11px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-purse{margin-top:auto;display:flex;align-items:baseline;gap:4px}
.lt-num{font-family:var(--display);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.lt-unit{font-size:11px;color:var(--steel)}
.lt.is-short .lt-num{color:var(--red)}
.lt-pips{display:flex;gap:3px;margin-top:6px}
.lt-pips i{flex:1;max-width:16px;height:4px;border-radius:1px;background:var(--line)}
.lt-pips i.on{background:var(--silver)}
.lt-pips i.cap{background:var(--champ)}

/* duotone portraits */
.duo{position:relative;overflow:hidden;background:#000;isolation:isolate}
.duo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.2) brightness(.92)}
.duo::after{content:'';position:absolute;inset:0;background:linear-gradient(195deg,rgba(248,4,20,0) 35%,rgba(248,4,20,.62) 100%);mix-blend-mode:multiply;pointer-events:none}

/* ---------- page shell ---------- */
.shell{max-width:1200px;margin:0 auto;padding:22px 16px 0}
@media (min-width:760px){ .shell{padding:30px 24px 0} }
.view{display:none}
.view.active{display:block}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:16px}
.page-head h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.005em}
.page-head p{font-size:13px;color:var(--steel)}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.block-head h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.count{font-size:12px;font-weight:500;color:var(--steel)}
.card{background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-head h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.fine{font-size:12px;color:var(--steel);margin-top:10px;line-height:1.5}
.note{font-size:13px;color:var(--red);margin-top:12px;line-height:1.45}
.hint{font-size:12px;color:var(--steel);margin-top:10px;line-height:1.5}
.empty-state{color:var(--steel);font-size:13px;text-align:center;padding:18px 8px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--graphite);font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--steel)}
.btn-red,.btn-primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-red:hover:not(:disabled),.btn-primary:hover:not(:disabled){background:var(--ember);border-color:var(--ember)}
.btn-danger{color:var(--red);border-color:rgba(248,4,20,.55);background:transparent}
.btn-sm{height:34px;padding:0 12px;font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.mini-btn{height:28px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--graphite);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.mini-btn:hover:not(:disabled){border-color:var(--steel)}
.mini-btn.accent{border-color:rgba(248,4,20,.6);color:var(--red)}
.link-btn{font-size:12px;font-weight:500;color:var(--steel);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.link-btn:hover{color:var(--silver)}
.in,.field,.num-input{height:38px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--graphite);font-size:14px;color:var(--silver);min-width:0}
.in:focus,.field:focus,.num-input:focus{outline:none;border-color:var(--red)}
.num-input,.in-sm{width:84px;font-variant-numeric:tabular-nums}
.in-sm.sm,.num-input.sm{width:64px}

/* ---------- auction ---------- */
.auction-grid{display:grid;gap:18px}
@media (min-width:980px){ .auction-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start} .col-wide{grid-column:1 / -1} }

.stage{position:relative;overflow:hidden;background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 20px;min-height:300px;display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%)}
@media (min-width:760px){ .stage{padding:24px 26px 26px;min-height:360px} }
.stage-mark{position:absolute;right:-8%;top:52%;width:64%;max-width:460px;transform:translateY(-50%);opacity:.07;pointer-events:none}
.stage > *:not(.stage-mark){position:relative}
.stage-top{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--steel);padding-right:22px}
.stage-queue{margin-left:auto;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.chip-A{background:var(--champ);color:#17130A}
.chip-O{background:var(--raise);color:var(--silver);border:1px solid var(--line)}
.chip-L{background:transparent;color:var(--champ);border:1px solid var(--champ)}
.stage{container-type:inline-size}
.stage-name{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,120px);font-size:clamp(40px,calc(100cqw / (var(--len,6) * .66)),132px);line-height:.86;text-transform:uppercase;margin-top:26px;white-space:nowrap}
.stage-name::after{content:'';display:block;width:76px;height:6px;background:var(--red);transform:skewX(-28deg);margin:16px 0 0 4px}
.stage-foot{margin-top:auto;padding-top:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.bid-label{font-size:12px;color:var(--steel)}
.bid-num{font-family:var(--display);font-weight:700;font-size:clamp(46px,10vw,76px);line-height:.95;font-variant-numeric:tabular-nums}
.bid-num small{font-size:.36em;color:var(--steel);font-weight:600;margin-left:6px;letter-spacing:.02em}
.bid-holder{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;font-weight:600}
.bid-holder .av{width:24px;height:24px}
.bid-holder.none{color:var(--steel);font-weight:500}
.stage-done{justify-content:center;min-height:240px}
.stage-done h2{font-family:var(--display);font-weight:800;font-size:clamp(44px,10vw,84px);line-height:.9;text-transform:uppercase}
.stage-done h2::after{content:'';display:block;width:76px;height:6px;background:var(--red);transform:skewX(-28deg);margin:16px 0 14px 4px}
.stage-done p{color:var(--steel);font-size:14px;max-width:46ch}
.stage-done .btn{margin-top:16px;align-self:flex-start}

.ring{position:relative;width:104px;height:104px;flex-shrink:0;display:grid;place-items:center}
@media (min-width:760px){ .ring{width:124px;height:124px} }
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring-track{stroke:var(--line)}
.ring-bar{stroke:var(--silver);transition:stroke-dashoffset .95s linear,stroke .2s}
.ring.run .ring-bar,.ring.low .ring-bar{stroke:var(--red)}
.ring.idle .ring-bar{stroke:var(--dim);transition:none}
.ring-center{display:flex;flex-direction:column;align-items:center;line-height:1}
.ring-num{font-family:var(--display);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums}
@media (min-width:760px){ .ring-num{font-size:48px} }
.ring-unit{font-size:10.5px;color:var(--steel);margin-top:2px}
.ring.low .ring-num{color:var(--red)}
.ring.idle .ring-num{color:var(--steel)}

.dock{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:8px;margin-top:12px}
.dock-btn{height:50px;border-radius:var(--r);background:var(--graphite);border:1px solid var(--line);font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.dock-btn:hover:not(:disabled){border-color:var(--steel)}
.dock-btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.dock-btn.primary:hover:not(:disabled){background:var(--ember);border-color:var(--ember)}
.dock-btn.sold{background:var(--silver);border-color:var(--silver);color:var(--ink)}
@media (max-width:979px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);border-top:1px solid var(--line)}
  @supports (backdrop-filter:blur(1px)){ .dock{background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)} }
  body.dock-on{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

.result{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--carbon);font-size:13.5px}
.result-tag{font-family:var(--display);font-weight:700;font-size:13px;padding:2px 8px;border-radius:3px;background:var(--signal);color:#04150D}
.result.unsold .result-tag{background:var(--red);color:var(--on-red)}
.result b{font-weight:600}
.result .amt{margin-left:auto;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.result.fresh{animation:resultIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.console{display:flex;flex-direction:column;gap:8px}
.bidder{position:relative;background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 12px 16px;transition:border-color .2s,background .2s}
.bidder::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--team);border-radius:0 2px 2px 0}
.bidder.is-leading{border-color:var(--red);background:linear-gradient(var(--red-ghost),var(--red-ghost)),var(--carbon)}
.bidder.is-locked{opacity:.5}
.bidder-id{display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0}
.av img{object-position:50% 28%}
.bidder-text{flex:1;min-width:0}
.bidder-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.bidder-sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--steel);margin-top:2px}
.bidder-sub b{color:var(--silver);font-weight:600;font-variant-numeric:tabular-nums}
.state{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--steel);letter-spacing:.02em}
.state.lead{background:var(--red);border-color:var(--red);color:var(--on-red)}
.state.warn{color:var(--red);border-color:rgba(248,4,20,.5)}
.bid-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.bid-btns.one{grid-template-columns:1fr}
.inc-btn{height:42px;border-radius:var(--r);background:var(--graphite);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,color .12s}
.inc-btn:hover:not(:disabled),.inc-btn:active:not(:disabled){background:var(--red);border-color:var(--red);color:var(--on-red)}
.inc-btn.open{font-family:var(--ui);font-size:14px;font-weight:600}
.purse-edit{display:flex;gap:6px;margin-top:10px}
.purse-edit .num-input{flex:1;width:auto}

.lists{display:grid;gap:14px}
@media (min-width:760px){ .lists{grid-template-columns:1fr 1fr} }
.qlist{list-style:none}
.qlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.qlist li:first-child{border-top:0}
.q-name{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-meta{font-size:12px;color:var(--steel);white-space:nowrap}

/* ---------- players ---------- */
.players-grid{display:grid;gap:14px}
@media (min-width:760px){ .players-grid{grid-template-columns:1fr 1fr} }
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line-2)}
.prow:first-child{border-top:0}
.name-input{flex:1;min-width:0;height:38px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:0 8px;margin-left:-8px;font-size:14.5px;font-weight:500;color:var(--silver)}
.name-input:hover:not([readonly]){border-color:var(--line)}
.name-input:focus{outline:none;border-color:var(--red);background:var(--graphite)}
.pstatus{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--steel);white-space:nowrap}
.pstatus .team{display:inline-flex;align-items:center;gap:6px;color:var(--silver);font-weight:500}
.pstatus .team i{width:7px;height:7px;border-radius:50%;background:var(--team)}
.pstatus .price{font-family:var(--display);font-weight:700;font-size:15px;color:var(--silver);font-variant-numeric:tabular-nums}
.pstatus .on-block{color:var(--red);font-weight:600}
.pstatus .unsold{color:var(--red)}
.add-card{margin-top:14px}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row .in{flex:1 1 160px}

/* ---------- standings ---------- */
.table{background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tr{display:grid;grid-template-columns:34px minmax(0,1fr) 30px 42px 58px;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
.tr.th{border-top:0;padding-top:10px;padding-bottom:10px;font-size:11.5px;color:var(--steel)}
.c-p,.c-l{display:none}
.tr > .c{text-align:center;font-variant-numeric:tabular-nums}
.tr > .c-pts{text-align:right}
@media (min-width:640px){
  .tr{grid-template-columns:44px minmax(0,1fr) 40px 40px 40px 52px 72px;padding:14px 18px}
  .c-p,.c-l{display:block}
}
.rk{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--steel);font-variant-numeric:tabular-nums}
.tr.r1 .rk{color:var(--champ)}
.tm{position:relative;display:flex;align-items:center;gap:10px;padding-left:12px;min-width:0}
.tm::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--team);border-radius:1px}
.tm-text{min-width:0}
.tm-name{font-weight:600;font-size:15px}
.tm-nick{font-size:11.5px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--steel);white-space:nowrap;flex-shrink:0}
.q-tag.q-final{color:var(--champ);border-color:var(--champ)}
.q-tag.q-semi{color:var(--silver)}
.q-tag.q-out{color:var(--red);border-color:rgba(248,4,20,.5)}
.c-pts{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.tr.th .c-pts{font-family:var(--ui);font-size:11.5px;font-weight:400}

.fx-grid{display:grid;gap:10px}
@media (min-width:760px){ .fx-grid{grid-template-columns:1fr 1fr} }
@media (min-width:1100px){ .fx-grid{grid-template-columns:1fr 1fr 1fr} }
.fx{background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.fx.is-editing{border-color:var(--red)}
.fx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:28px}
.fx-label{font-size:12px;color:var(--steel)}
.fx-row{position:relative;display:flex;align-items:center;gap:10px;padding:6px 0 6px 12px;font-size:14.5px}
.fx-row::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--team);border-radius:1px}
.fx-team{flex:1;min-width:0;font-weight:500;color:var(--steel)}
.fx-row.win .fx-team{color:var(--silver);font-weight:600}
.fx-score{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;min-width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--steel)}
.fx-row.win .fx-score{color:var(--silver)}
.fx-pts{min-width:62px;text-align:right;font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums}
.fx-row.win .fx-pts{color:var(--champ)}
.fx-pending .fx-team{color:var(--silver)}
.fx-rounds{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--steel)}
.fx-msg{font-size:12px;color:var(--steel);min-height:16px;margin-top:4px}
.fx-msg.err{color:var(--red)}
.fx-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbd{color:var(--steel);font-weight:400;font-style:italic}

/* ---------- playoffs ---------- */
.flow{display:grid;gap:8px}
@media (min-width:860px){ .flow{grid-template-columns:1fr 1fr 1fr} }
.flow-step{position:relative;background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.flow-step h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.flow-step p{font-size:12.5px;color:var(--steel);margin-top:3px}
.flow-step.final{border-color:var(--champ)}
.flow-step.final h3{color:var(--champ)}
.seeds{list-style:none}
.seeds li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.seeds li:first-child{border-top:0}
.bracket{display:grid;gap:12px}
@media (min-width:860px){
  .bracket{grid-template-columns:1fr 1fr;align-items:center;gap:48px}
  .bracket .fx.semi::after{content:'';position:absolute;right:-49px;top:50%;width:48px;height:1px;background:var(--line)}
  .bracket .fx{position:relative}
}
.bracket .fx.final{border-color:var(--champ)}
.champion{position:relative;overflow:hidden;background:var(--carbon);border:1px solid var(--champ);border-radius:var(--r-lg);padding:28px 20px;text-align:center}
.champion .lbl{font-size:12.5px;color:var(--champ)}
.champion h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,8vw,64px);line-height:.95;text-transform:uppercase;margin-top:8px}
.placings{list-style:none;margin-top:10px}
.placings li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.placings li:first-child{border-top:0}

/* ---------- rosters ---------- */
.roster-grid{display:grid;gap:14px}
@media (min-width:760px){ .roster-grid{grid-template-columns:1fr 1fr} }
.roster{position:relative;background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.roster-head{position:relative;display:flex;gap:14px;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.roster-head::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--team)}
.roster-photo{width:64px;height:84px;border-radius:3px;flex-shrink:0}
.roster-title{flex:1;min-width:0}
.roster-title h3{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.02}
.roster-title p{font-size:12.5px;color:var(--steel);margin-top:3px}
.roster-purse{text-align:right}
.roster-purse .n{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.roster-purse span{display:block;font-size:11px;color:var(--steel)}
.roster-list{list-style:none;padding:4px 16px 10px}
.roster-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:14px}
.roster-list li:first-child{border-top:0}
.roster-list .nm{flex:1;min-width:0;font-weight:500}
.roster-list .pr{font-family:var(--display);font-weight:700;font-size:16px;color:var(--steel);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.roster-list li.open .nm{color:var(--dim);font-style:italic;font-weight:400}

/* ---------- auditor (legacy classes restyled) ---------- */
.aud-wrap{max-width:760px}
.section-title{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;margin:26px 0 10px}
.section-title:first-child{margin-top:0}
.section-title .count{font-family:var(--ui)}
.panel{background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.aud-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.aud-row:first-child{border-top:0}
.aud-row .lbl{flex:1;min-width:140px;font-size:14px;font-weight:600}
.aud-row .lbl small{display:block;color:var(--steel);font-weight:400;font-size:12px;margin-top:1px}
.pin-gate{display:flex;gap:8px}
.pin-gate input{flex:1;height:40px;background:var(--graphite);border:1px solid var(--line);color:var(--silver);border-radius:var(--r);padding:0 12px;font-size:16px;letter-spacing:.3em}
.login-grid{display:flex;flex-direction:column;gap:8px;max-width:380px}
.login-grid .btn{align-self:flex-start}
select.field{padding-right:28px}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 16px calc(22px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (max-width:979px){ body.dock-on .toast-wrap{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))} }
.toast{max-width:560px;background:var(--silver);color:var(--ink);font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:var(--r);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:none}

body.readonly .admin-only{display:none !important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media (prefers-color-scheme:light){ :root:not([data-theme]) .lockup-mark, :root:not([data-theme]) .stage-mark{filter:invert(1) hue-rotate(180deg) saturate(1.4)} }
[data-theme="light"] .stage-mark{filter:invert(1) hue-rotate(180deg) saturate(1.4)}

.plist{list-style:none}
.players-grid > *, .lists > *, .roster-grid > *, .fx-grid > *, .auction-grid > *, .leader-band > *, .flow > *, .bracket > *{min-width:0}
.name-input{flex:1 1 0;width:0}
.saira .stage-name{font-size:clamp(44px,calc(100cqw / (var(--len,6) * .54)),150px)}

/* ---------- economy, leaderboard, formats, availability, identity, rulebook ---------- */
.bid-money{font-size:14px;font-weight:600;color:var(--champ);margin-top:2px;font-variant-numeric:tabular-nums}
.money{color:var(--champ);font-weight:500;margin-left:2px}
.lt-money{font-size:11px;color:var(--champ);margin-left:6px;font-variant-numeric:tabular-nums}
@media (max-width:759px){ .lt-purse{flex-wrap:wrap;row-gap:0} .lt-money{flex-basis:100%;margin:1px 0 0} }
.result .amt small{display:block;font-family:var(--ui);font-size:11px;font-weight:600;color:var(--champ);text-align:right}
@media (min-width:1100px){ .lists{grid-template-columns:repeat(3,1fr)} }

.lb{list-style:none;counter-reset:none}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.lb li:first-child{border-top:0}
.lb-rk{font-family:var(--display);font-weight:700;font-size:22px;width:26px;color:var(--steel);font-variant-numeric:tabular-nums}
.lb li:first-child .lb-rk{color:var(--champ)}
.lb-name{flex:1;min-width:0;display:flex;flex-direction:column}
.lb-name b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-team{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--steel)}
.lb-team i{width:7px;height:7px;border-radius:50%;background:var(--team)}
.lb-team em{font-style:normal;color:var(--red);font-weight:600;margin-left:4px}
.lb li.is-live{background:linear-gradient(90deg,var(--red-ghost),transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.lb-amt{text-align:right;min-width:74px}
.lb-amt b{display:block;font-family:var(--display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.lb-amt small{font-size:11.5px;color:var(--champ);font-weight:600}
.lb-card{margin-bottom:14px}
@media (max-width:420px){ .lb .chip{display:none} }

.leg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:18px 0 10px}
.leg-head h3{font-family:var(--display);font-weight:700;font-size:17px;color:var(--silver)}
.leg-head p{font-size:12.5px;color:var(--steel)}
.fx-forfeit{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--steel)}
.fx-forfeit span{margin-right:4px}
.ff-tag{font-size:10px;font-weight:700;color:var(--red);border:1px solid rgba(248,4,20,.5);border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:1px}

.avail-bar{font-size:12.5px;color:var(--steel);padding:9px 16px;border-bottom:1px solid var(--line-2)}
.avail-bar b{color:var(--silver)}
.avail-bar.low{color:var(--red);background:var(--red-ghost)}
.avail-bar.low b{color:var(--red)}
.roster-list .pr small{display:block;font-family:var(--ui);font-size:10.5px;font-weight:600;color:var(--champ)}
.roster-list li.is-out .nm{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--red)}
.avail,.avail-ro{height:26px;min-width:44px;padding:0 8px;border-radius:13px;font-size:11.5px;font-weight:700;border:1px solid rgba(248,4,20,.55);color:var(--red);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.avail.on,.avail-ro.on{border-color:var(--line);color:var(--signal)}
.viewer-only{display:none !important}
body.readonly .viewer-only{display:inline-flex !important}

.team-edit-grid{display:grid;gap:12px}
@media (min-width:760px){ .team-edit-grid{grid-template-columns:1fr 1fr} }
.team-edit{position:relative;overflow:hidden}
.team-edit::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--team)}
.te-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.te-photo{width:44px;height:58px;border-radius:3px;flex-shrink:0}
.te-id b{display:block;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.te-id small{font-size:12px;color:var(--steel)}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:8px;min-width:0}
.fld > span{font-size:12px;color:var(--steel)}
.fld .in,.fld .field{width:100%}
.fld-row{display:grid;grid-template-columns:auto 1fr;gap:10px}
.color-in{width:56px;height:38px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--graphite);cursor:pointer}

.rulebook{display:grid;gap:14px;max-width:820px}
.rulebook h2{font-family:var(--display);font-weight:700;font-size:22px;margin-bottom:4px}
.rule{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.rule:first-of-type{border-top:0}
.rn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--red);font-variant-numeric:tabular-nums}
.rule h3{font-size:14.5px;font-weight:600}
.rule p{font-size:14px;color:var(--steel);line-height:1.55;margin-top:3px;max-width:68ch}

/* ---------- stats, MVPs, titles ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.glow{position:relative;border:1.5px solid transparent !important;animation:spinb 4s linear infinite}
.glow-gold{background:linear-gradient(var(--carbon),var(--carbon)) padding-box,conic-gradient(from var(--ang),#C9A961,#FFF3C4,#8A6D2B,#E9CF86,#C9A961) border-box !important;box-shadow:0 0 26px -8px rgba(201,169,97,.55)}
.glow-rainbow{background:linear-gradient(var(--carbon),var(--carbon)) padding-box,conic-gradient(from var(--ang),#FF2E6E,#FF9F1C,#FFE45C,#39FFB0,#00E5FF,#8B5CFF,#FF2E6E) border-box !important;box-shadow:0 0 34px -10px rgba(255,46,110,.6)}
@keyframes spinb{to{--ang:360deg}}
.hero{display:flex;align-items:center;gap:16px;padding:18px 20px}
.hrk{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;color:var(--champ)}
.hmid{min-width:0;flex:1}
.hname{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:.92;text-transform:uppercase;overflow-wrap:anywhere}
.hteam{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--steel);margin-top:6px}
.hteam i,.mt i{width:8px;height:8px;border-radius:50%;background:var(--team);flex-shrink:0}
.hk{text-align:right}
.hk b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(44px,9vw,64px);line-height:.9;font-variant-numeric:tabular-nums}
.hk span{font-size:12px;color:var(--steel)}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ttl{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--graphite);white-space:nowrap}
.stats-grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){ .stats-grid{grid-template-columns:1.35fr 1fr} }
.stats-grid > *{min-width:0}
.kl{list-style:none}
.kl li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.kl li:first-child{border-top:0}
.kl li.is-top .lb-rk{color:var(--champ)}
.kl .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.kl .nm b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kl .ic{letter-spacing:1px;font-size:13px}
.kl .kv{text-align:right;min-width:62px}
.kl .kv b{display:block;font-family:var(--display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.kl .kv small{font-size:11px;color:var(--steel)}
.title-list{list-style:none}
.title-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.title-list li:first-child{border-top:0}
.title-list .ti{font-size:20px;width:26px;text-align:center}
.title-list .tt{flex:1;min-width:0}
.title-list .tt b{display:block;font-size:14px;font-weight:600}
.title-list .tt small{font-size:12px;color:var(--steel)}
.title-list .th{font-size:13px;font-weight:600;text-align:right;max-width:45%}
.title-list .th em{font-style:normal;color:var(--dim);font-weight:500}
.mvp-grid{display:grid;gap:12px}
@media (min-width:760px){ .mvp-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1100px){ .mvp-grid{grid-template-columns:repeat(3,1fr)} }
.mvp-grid > *{min-width:0}
.mvp-card{padding:16px}
.mvp-card .mh{font-size:12px;color:var(--steel)}
.mvp-card .mn{font-family:var(--display);font-weight:800;font-size:36px;line-height:.92;text-transform:uppercase;margin-top:8px;overflow-wrap:anywhere}
.mvp-card .mk{font-family:var(--display);font-weight:700;font-size:20px;color:var(--champ);margin-top:4px}
.mvp-card .mt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--steel);margin-top:6px}
.mvp-chip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 10px;border-radius:var(--r);border:1px solid rgba(201,169,97,.5);background:rgba(201,169,97,.08);font-size:13px;text-align:left}
.mvp-chip:hover{border-color:var(--champ)}
.mvp-chip b{color:var(--champ);font-weight:700}
.mvp-chip .k{margin-left:auto;font-family:var(--display);font-weight:700;font-size:17px}
.nemesis{font-size:12.5px;color:var(--steel);margin-top:8px;line-height:1.4}
.nemesis b{color:var(--red);font-weight:700}
.fx-extra{display:flex;justify-content:flex-end;margin-top:8px}

/* ---------- modal ---------- */
body.modal-open{overflow:hidden}
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
@supports (backdrop-filter:blur(1px)){ .modal-backdrop{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)} }
@media (min-width:760px){ .modal-backdrop{align-items:center;padding:24px} }
.modal{width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;background:var(--carbon);border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px);animation:modalIn .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){ .modal{border-radius:var(--r-lg)} }
@keyframes modalIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- neon / cyberpunk mode ---------- */
:root[data-theme="neon"]{
  --ink:#05040D; --carbon:#0C0A1C; --graphite:#141130; --raise:#1B1740;
  --line:#2C2766; --line-2:#1A1644; --silver:#F1F7FF; --steel:#9396CF; --dim:#4C4A86;
  --red:#FF2E97; --ember:#D1127A; --red-ghost:rgba(255,46,151,.12);
  --champ:#FFE45C; --signal:#39FFB0; --on-red:#FFFFFF;
  color-scheme:dark;
}
[data-theme="neon"] body{background:radial-gradient(1100px 600px at 85% -10%,rgba(0,229,255,.12),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(255,46,151,.14),transparent 60%),var(--ink);background-attachment:fixed}
[data-theme="neon"] .stage,[data-theme="neon"] .card,[data-theme="neon"] .lt,[data-theme="neon"] .bidder,[data-theme="neon"] .fx,[data-theme="neon"] .table,[data-theme="neon"] .roster,[data-theme="neon"] .panel,[data-theme="neon"] .flow-step{border-color:rgba(0,229,255,.22)}
[data-theme="neon"] .stage{box-shadow:0 0 0 1px rgba(0,229,255,.18),0 0 40px -6px rgba(255,46,151,.25)}
[data-theme="neon"] .stage-name,[data-theme="neon"] .page-head h1,[data-theme="neon"] .hname{text-shadow:0 0 18px rgba(0,229,255,.55),0 0 2px rgba(255,255,255,.6)}
[data-theme="neon"] .lockup-apex{text-shadow:0 0 12px rgba(0,229,255,.7)}
[data-theme="neon"] .tab.active::after,[data-theme="neon"] .stage-name::after{box-shadow:0 0 14px var(--red),0 0 4px var(--red)}
[data-theme="neon"] .ring.run .ring-bar,[data-theme="neon"] .ring.low .ring-bar{filter:drop-shadow(0 0 6px var(--red))}
[data-theme="neon"] .lt.is-leading,[data-theme="neon"] .bidder.is-leading{box-shadow:0 0 22px -2px rgba(255,46,151,.5)}
[data-theme="neon"] .btn-red,[data-theme="neon"] .dock-btn.primary,[data-theme="neon"] .btn-primary{box-shadow:0 0 18px -2px rgba(255,46,151,.7)}
[data-theme="neon"] .rk,[data-theme="neon"] .c-pts,[data-theme="neon"] .lt-num,[data-theme="neon"] .bid-num{text-shadow:0 0 12px rgba(0,229,255,.35)}

/* ---------- auditor-only analytics ---------- */

.an-step{margin-bottom:14px}

.um-list li .field{flex:0 0 150px;height:32px;font-size:13px}

.kpi{background:var(--carbon);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}

@media print{
  :root{--ink:#fff;--carbon:#fff;--graphite:#f4f4f6;--line:#d6d6dc;--line-2:#e6e6ea;--silver:#111;--steel:#555;--champ:#8a6d2b}

/* Modern Esports Glassmorphism & Micro-animations */
.masthead {
  backdrop-filter: blur(20px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
  background: rgba(14, 16, 22, 0.78) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
}
.lt {
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(17, 21, 30, 0.72) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 12px !important;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease !important;
}
.lt:hover {
  transform: translateY(-3px) !important;
  border-color: rgba(255, 255, 255, 0.18) !important;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
}
.lt.is-leading {
  box-shadow: 0 0 25px -4px rgba(248, 4, 20, 0.5) !important;
}
.stage {
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  background: rgba(17, 21, 30, 0.75) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 20px !important;
  box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7) !important;
  clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%) !important;
  transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
}
.stage::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
}
.stage-name {
  background: linear-gradient(180deg, #ffffff 40%, #b0b7c6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
  letter-spacing: 0.01em;
}
.stage-name::after {
  box-shadow: 0 0 16px var(--red);
  border-radius: 2px;
}
.bid-num {
  text-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
  font-family: var(--display) !important;
  font-weight: 900 !important;
}
.card, .panel, .fx, .roster, .flow-step {
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(17, 21, 30, 0.72) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 14px !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
}
.card:hover, .fx:hover:not(.is-editing), .roster:hover {
  border-color: rgba(255, 255, 255, 0.16) !important;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.bidder {
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(17, 21, 30, 0.72) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 14px !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
}
.bidder:hover {
  border-color: rgba(255, 255, 255, 0.16) !important;
  transform: translateY(-2px);
}
.bidder.is-leading {
  background: linear-gradient(135deg, rgba(248, 4, 20, 0.14), rgba(17, 21, 30, 0.85)) !important;
  box-shadow: 0 0 25px -4px rgba(248, 4, 20, 0.5) !important;
}

/* Kinetic spring physics on interactive buttons */
.btn, .dock-btn, .inc-btn, .mini-btn {
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}
.btn:hover:not(:disabled), .dock-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}
.btn:active:not(:disabled), .dock-btn:active:not(:disabled) {
  transform: translateY(1px) scale(0.98);
}
.inc-btn:hover:not(:disabled) {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 4px 18px var(--red-ghost);
}
.inc-btn:active:not(:disabled) {
  transform: translateY(1px) scale(0.96);
}
.mini-btn:hover:not(:disabled) {
  transform: scale(1.05);
}
.mini-btn:active:not(:disabled) {
  transform: scale(0.95);
}

/* Live Arena Ticker Styling */
.live-ticker-wrap {
  background: linear-gradient(90deg, #0b0c10 0%, #151821 50%, #0b0c10 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--steel);
  z-index: 45;
}
.ticker-badge {
  background: var(--red);
  color: #fff;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.1em;
  padding: 0 14px;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 2;
  box-shadow: 4px 0 12px rgba(0,0,0,0.4);
}
.ticker-badge span.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff;
  animation: radarPing 1.4s infinite cubic-bezier(0, 0, 0.2, 1);
}
.ticker-track {
  display: inline-flex;
  gap: 40px;
  animation: tickerSlide 35s linear infinite;
  padding-left: 20px;
}
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.ticker-item em {
  font-style: normal;
  color: var(--silver);
}
.ticker-item .pts {
  color: var(--champ);
  font-family: var(--mono);
  font-weight: 700;
}
@keyframes tickerSlide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes radarPing {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 26, 53, 0.7); }
  70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 26, 53, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 26, 53, 0); }
}

/* Tab active glowing underline */
.tab.active::after {
  box-shadow: 0 0 14px var(--red) !important;
  border-radius: 3px 3px 0 0 !important;
}

/* Ring pulse */
.ring.low .ring-bar {
  filter: drop-shadow(0 0 10px var(--red)) !important;
}
.ring.run .ring-bar {
  filter: drop-shadow(0 0 8px var(--champ)) !important;
}

</style>

const SoundFX = (function() {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) ctx = new AudioContext();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  return {
    bidPlaced() {
      const c = getCtx(); if (!c) return;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(580, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, c.currentTime + 0.12);
      g.gain.setValueAtTime(0.2, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.22);
      osc.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + 0.25);
    },
    tick() {
      const c = getCtx(); if (!c) return;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1040, c.currentTime);
      g.gain.setValueAtTime(0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.05);
      osc.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + 0.06);
    },
    warning() {
      const c = getCtx(); if (!c) return;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, c.currentTime);
      osc.frequency.setValueAtTime(880, c.currentTime + 0.08);
      g.gain.setValueAtTime(0.18, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
      osc.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + 0.2);
    },
    soldGavel() {
      const c = getCtx(); if (!c) return;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, c.currentTime);

      osc.start(); osc.stop(c.currentTime + 0.42);

  };
})();

/* Upgrades any older save (or imported file) to the current shape without losing results. */
function migrate(s){
  if(!s || typeof s!=='object' || !Array.isArray(s.players) || !s.teams) return null;
  if(typeof s.theme==='undefined') s.theme = null;
  if(!s.squadSize) s.squadSize = DEFAULT_SQUAD;
  if(!s.profiles || typeof s.profiles!=='object') s.profiles = {};
  LEADER_KEYS.forEach(k=>{ if(!s.profiles[k]) s.profiles[k] = {}; });
  if(!s.photos || typeof s.photos!=='object') s.photos = {};
  s.economy = Object.assign({ rate:10, symbol:'£' }, s.economy || {});
  const fm = s.format || {};
  const legs = Array.isArray(fm.legs) && fm.legs.length ? fm.legs : [{ map:'Map 1', rounds:21 }, { map:'Map 2', rounds:19 }];
  s.format = { legs: legs.map((l,i)=>({ map: (l && l.map) || ('Map '+(i+1)), rounds: (l && l.rounds) || 21 })), playoffs: Object.assign({ map:'the competitive map pool', rounds:21 }, fm.playoffs || {}) };
  if(!s.unavailable || typeof s.unavailable!=='object') s.unavailable = {};
  s.auctionCfg = Object.assign({ timer:15, baseA:150, baseO:50 }, s.auctionCfg || {});
  if(!Array.isArray(s.fixtures)) s.fixtures = FIXTURES.map(f=>({...f, played:false, winner:null}));
  s.fixtures.forEach(f=>{ ['rounds','homeRounds','awayRounds'].forEach(k=>{ if(typeof f[k]==='undefined') f[k]=null; }); });
  s.scoring = { ...DEFAULT_SCORING, ...(s.scoring||{}) };
  if(!s.playoffs || 'sf1' in s.playoffs || 'sf2' in s.playoffs) s.playoffs = { semi:null, final:null };   // old 4-team bracket → new format
  if(!('semi' in s.playoffs)) s.playoffs.semi = null;
  if(!('final' in s.playoffs)) s.playoffs.final = null;

  if(!s.schema || s.schema < 3){
    const prevOrder = [...s.players.filter(p=>p.cat==='A'), ...s.players.filter(p=>p.cat!=='A')].map(p=>p.id);
    let maxN = s.players.reduce((m,p)=>{
      const n = parseInt(String(p.id).replace(/\D/g,''),10);
      return isNaN(n) ? m : Math.max(m,n);
    }, -1);
    const added = [];
    NEW_PLAYERS_V3.forEach(name=>{
      if(!s.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
        maxN += 1;
        const np = { id:'p'+maxN, name, cat:'O', base:BASE.O, status:'available', team:null, price:null };
        s.players.push(np); added.push(np.id);
      }
    });
    const unsold = s.players.filter(p=>p.status==='unsold');
    unsold.forEach(p=>{ p.status='available'; });
    const unsoldIds = unsold.map(p=>p.id);
    s.order = [...prevOrder.filter(id=>!unsoldIds.includes(id)), ...added, ...unsoldIds];
    s.currentId = null; s.currentBid = null; s.lastResult = null;
    delete s.queueIndex;
    s.schema = 3;
  }
  if(!Array.isArray(s.order)) s.order = s.players.map(p=>p.id);
  s.players.forEach(p=>{ if(!s.order.includes(p.id)) s.order.push(p.id); });
  s.timerRunning = false;                 // a timer never survives a reload
  if(typeof s.timeLeft!=='number') s.timeLeft = TIMER_START;
  return s;
}

/* =========================================================
   LIVE SYNC ENGINE (Firebase Realtime Database)
   Admin (signed in) writes · everyone else watches live
========================================================= */
const SESSION_ID = Math.random().toString(36).slice(2);
const cloud = { enabled:false, ref:null, auth:null, user:null, connected:false, pushError:null, lastPushAt:null, writeTimer:null };
let viewerTimerBase = Date.now();

function readOnly(){ return cloud.enabled && !cloud.user; }
function isAdmin(){ return !cloud.enabled || !!cloud.user; }
function applyReadOnly(){ document.body.classList.toggle('readonly', readOnly()); if(typeof syncAuditorClass==='function') syncAuditorClass(); }

function pushState(){
  if(!cloud.enabled || !cloud.user) return;
  clearTimeout(cloud.writeTimer);
  cloud.writeTimer = setTimeout(()=>{
    const data = JSON.parse(JSON.stringify(state));
    delete data.theme;
    delete data.photos;
    data.syncMeta = { by: SESSION_ID, at: Date.now() };
    cloud.ref.set(data).then(()=>{
      cloud.lastPushAt = Date.now(); cloud.pushError = null; renderStatusOnly();
    }).catch(err=>{
      const code = String((err && (err.code||err.message)) || 'error');
      cloud.pushError = code;
      toast(/permission/i.test(code) ? "Live sync refused — this account isn't the admin in your database rules" : 'Live sync failed — will retry on next change');
      renderStatusOnly();
    });
  }, 120);
}

function initCloud(){
  if(typeof firebase === 'undefined' || !FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    cloud.auth = firebase.auth();
    cloud.ref = firebase.database().ref(SYNC_PATH);
    cloud.photosRef = firebase.database().ref(SYNC_PATH.replace(/[^/]+$/, 'photos'));
    cloud.enabled = true;
  }catch(e){ cloud.enabled = false; return; }
  applyReadOnly(); render();

  firebase.database().ref('.info/connected').on('value', s=>{ cloud.connected = !!s.val(); renderStatusOnly(); });

  cloud.auth.onAuthStateChanged(u=>{
    cloud.authUser = u || null;
    cloud.user = (u && !u.isAnonymous) ? u : null;
    applyReadOnly();
    if(cloud.user){
      if(state.timerRunning){ state.timerRunning = false; }   // admin takes over paused
      cloud.ref.once('value').then(s=>{ if(!s.val()) pushState(); });
      cloud.photosRef.once('value').then(s=>{ if(!s.val() && state.photos && Object.keys(state.photos).length) pushPhotos(); });
    }
    render();
  });

  cloud.photosRef.on('value', snap=>{
    state.photos = snap.val() || {};
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    render();
  });
  cloud.ref.on('value', snap=>{
    const val = snap.val();
    if(!val) return;
    if(cloud.user && val.syncMeta && val.syncMeta.by === SESSION_ID) return;   // our own write echoing back
    const running = !!val.timerRunning;
    const next = migrate(val);
    if(!next) return;
    next.theme = state ? state.theme : null;       // theme stays per-device
    next.photos = state ? state.photos : {};       // photos sync on their own path
    if(!cloud.user) next.timerRunning = running;   // viewers watch the live countdown
    clearInterval(timerHandle);
    state = next;
    applyConfig();
    editingPurse = null; editingFixture = null; editingPlayoff = null;
    viewerTimerBase = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    applyTheme(); render();
  }, err=>{ toast('Live results unavailable ('+(err && err.code || 'error')+')'); });

  // viewers: local countdown between updates
  setInterval(()=>{
    if(!readOnly() || !state || !state.timerRunning) return;
    const left = Math.max(0, state.timeLeft - Math.floor((Date.now()-viewerTimerBase)/1000));
    paintTimer(left, true);
  }, 250);
}

function applyConfig(){
  const a = (state && state.auctionCfg) || {};
  if(Number.isFinite(a.baseA)) BASE.A = a.baseA;
  if(Number.isFinite(a.baseO)) BASE.O = a.baseO;
  if(Number.isFinite(a.timer) && a.timer>=5) TIMER_START = a.timer;
}
function pushPhotos(){
  if(!cloud.enabled || !cloud.user || !cloud.photosRef) return;
  const ph = state.photos && Object.keys(state.photos).length ? state.photos : null;
  cloud.photosRef.set(ph).catch(()=>{});
}

/* =========================================================
   PERSISTENCE
========================================================= */
function saveState(){
  try{
    state.savedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveFailed = false;
  }catch(e){ saveFailed = true; }
  pushState();
  return !saveFailed;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return null;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* =========================================================
   HELPERS
========================================================= */
function playerById(id){ return state.players.find(p=>p.id===id); }
function currentPlayer(){
  if(state.currentId){
    const p = playerById(state.currentId);
    if(p && p.status==='available') return p;
  }
  for(const id of state.order){
    const p = playerById(id);
    if(p && p.status==='available'){ state.currentId = p.id; return p; }
  }
  state.currentId = null;
  return null;
}
function catCount(teamName, cat){ return state.teams[teamName].roster.filter(r=>r.cat===cat).length; }
function draftedCount(teamName){ return state.teams[teamName].roster.filter(r=>r.cat!=='L').length; }
function shortBy(name){ const open = draftSlots() - draftedCount(name); return open>0 ? Math.max(0, open*BASE.O - state.teams[name].purse) : 0; }
function slotsOpenTotal(){ return LEADER_KEYS.reduce((s,n)=>s+Math.max(0, draftSlots()-draftedCount(n)),0); }
function allSquadsFull(){ return LEADER_KEYS.every(n=>draftedCount(n) >= draftSlots()); }
function availableQueue(){ return state.order.map(playerById).filter(p=>p && p.status==='available'); }
function unsoldPlayers(){ return state.players.filter(p=>p.status==='unsold'); }
function blockIsBusy(){ return !!state.currentBid || state.timerRunning; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function reserveOk(teamName, amount){
  const team = state.teams[teamName];
  const slotsAfter = draftSlots() - draftedCount(teamName) - 1;
  return (team.purse - amount) >= Math.max(0, slotsAfter) * BASE.O;
}
function canTeamBid(teamName, increment){
  const p = currentPlayer();
  if(!p) return {ok:false, reason:''};
  const team = state.teams[teamName];
  if(draftedCount(teamName) >= draftSlots()) return {ok:false, reason:'Squad full'};
  if(catCount(teamName,p.cat) >= capFor(p.cat)) return {ok:false, reason:CAT_LABEL[p.cat]+' cap reached'};
  if(state.currentBid && state.currentBid.team===teamName) return {ok:false, reason:'Already highest bidder'};
  let amount;
  if(!state.currentBid){
    if(increment!=='OPEN') return {ok:false, reason:'Open the bidding first'};
    amount = p.base;
  } else {
    if(increment==='OPEN') return {ok:false, reason:'Bidding already open'};
    amount = state.currentBid.amount + increment;
  }
  if(amount > team.purse) return {ok:false, reason:'Exceeds purse'};
  if(!reserveOk(teamName, amount)) return {ok:false, reason:'Breaks reserve for remaining slots'};
  return {ok:true, amount};
}
function eligibleTeamsFor(p){
  return LEADER_KEYS.filter(n=> draftedCount(n) < draftSlots() && catCount(n,p.cat) < capFor(p.cat)
    && state.teams[n].purse >= p.base && reserveOk(n, p.base));
}

/* =========================================================
   ACTIONS — auction
========================================================= */
function resetBlock(){
  clearInterval(timerHandle);
  state.timerRunning = false;
  state.currentBid = null;
  state.timeLeft = TIMER_START;
}
function placeBid(teamName, incrementRaw){
  const increment = incrementRaw==='OPEN' ? 'OPEN' : parseInt(incrementRaw,10);
  const check = canTeamBid(teamName, increment);
  if(!check.ok) return;
  state.currentBid = { team: teamName, amount: check.amount };
  SoundFX.bidPlaced();
  if(state.timerRunning && state.timeLeft < ANTI_SNIPE_THRESHOLD && state.timeLeft > 0){
    state.timeLeft = ANTI_SNIPE_RESET;
  }
  saveState(); render();
}
function startTimer(){
  if(!currentPlayer()) return;
  state.timerRunning = true;
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    state.timeLeft -= 1;
    if(state.timeLeft <= 4 && state.timeLeft > 0){ SoundFX.warning(); } else if(state.timeLeft > 0){ SoundFX.tick(); }
    if(state.timeLeft <= 0){ state.timeLeft = 0; SoundFX.soldGavel(); confirmSale(); return; }
    updateTimerOnly();
  },1000);
  saveState(); render();
}
function pauseTimer(){
  state.timerRunning = false;
  clearInterval(timerHandle);
  saveState(); render();
}
function confirmSale(){
  SoundFX.soldGavel();

function updateTickerOnSale(player, team, amount) {
  const track = document.getElementById('tickerTrack');
  if(!track) return;
  const item = document.createElement('div');
  item.className = 'ticker-item';
  item.innerHTML = '⚡ <b>HAMMER FALL:</b> <em>' + esc(player) + '</em> acquired by <b>' + esc(L(team)) + '</b> for <span class="pts">' + amount + ' pts</span>';
  track.prepend(item);
}

  const p = currentPlayer();
  if(!p) return;
  if(state.currentBid){
    const {team, amount} = state.currentBid;
    p.status='sold'; p.team=team; p.price=amount;
    state.teams[team].purse -= amount;
    state.teams[team].roster.push({ id:p.id, name:p.name, cat:p.cat, price:amount });
    state.lastResult = { type:'sold', player:p.name, team, amount, text: p.name+' to '+team+' for '+amount+' pts', at:Date.now() };
    updateTickerOnSale(p.name, team, amount);
  } else {
    p.status='unsold';
    state.lastResult = { type:'unsold', player:p.name, text: p.name+' went unsold', at:Date.now() };
  }
  resetBlock();
  state.currentId = null;
  saveState(); render();
}
function markUnsold(){
  const p = currentPlayer();
  if(!p) return;
  p.status='unsold';
  state.lastResult = { type:'unsold', player:p.name, text: p.name+' went unsold', at:Date.now() };
  resetBlock();
  state.currentId = null;
  saveState(); render();
}
function nextPlayer(){
  const p = currentPlayer();
  if(!p || blockIsBusy()) return;
  state.order = state.order.filter(id=>id!==p.id).concat(p.id); // send to back of the queue
  state.currentId = null;
  const n = currentPlayer();
  state.lastResult = null;
  saveState(); render();
  if(n && n.id!==p.id) toast(p.name+' moved to the back · '+n.name+' is up');
}
function putOnBlock(id){
  if(blockIsBusy()){ toast('Finish the current player first'); return; }
  const p = playerById(id);
  if(!p || p.status==='sold') return;
  p.status = 'available';
  state.currentId = id;
  state.lastResult = null;
  resetBlock();
  saveState(); render();
  switchTab('auction');
  toast(p.name+' is on the block');
}
function reauctionUnsold(){
  const list = unsoldPlayers();
  if(!list.length) return;
  const ids = list.map(p=>p.id);
  list.forEach(p=>{ p.status='available'; });
  state.order = state.order.filter(id=>!ids.includes(id)).concat(ids);
  saveState(); render();
  toast(list.length+' unsold player'+(list.length>1?'s':'')+' back in the queue');
}

/* =========================================================
   ACTIONS — players
========================================================= */
function renamePlayer(id, rawName){
  const name = rawName.trim();
  const p = playerById(id);
  if(!p || !name){ render(); return; }
  p.name = name;
  Object.values(state.teams).forEach(t=>{ const r = t.roster.find(x=>x.id===id); if(r) r.name = name; });
  saveState(); render();
}
function addPlayer(rawName, cat){
  const name = rawName.trim();
  if(!name){ toast('Enter a player name'); return; }
  if(state.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ toast(name+' is already in the pool'); return; }
  const maxN = state.players.reduce((m,p)=>{ const n=parseInt(String(p.id).replace(/\D/g,''),10); return isNaN(n)?m:Math.max(m,n); }, -1);
  const np = { id:'p'+(maxN+1), name, cat, base:BASE[cat], status:'available', team:null, price:null };
  state.players.push(np);
  state.order.push(np.id);
  saveState(); render();
  toast(name+' added to '+CAT_LABEL[cat]);
}

/* =========================================================
   ACTIONS — standings / playoffs
========================================================= */
function fixturePoints(f){
  if(!f.played) return { home:0, away:0 };
  const ppr = state.scoring.pointsPerRound;
  const hr = f.homeRounds||0, ar = f.awayRounds||0;
  if(state.scoring.loserKeeps) return { home:hr*ppr, away:ar*ppr };
  return { home: f.winner===f.home ? hr*ppr : 0, away: f.winner===f.away ? ar*ppr : 0 };
}
function validateFixture(total, hr, ar){
  if(!Number.isInteger(total) || total<1) return { err:'Enter the number of rounds played' };
  if(!Number.isInteger(hr) || !Number.isInteger(ar) || hr<0 || ar<0) return { err:'Enter rounds won for both teams' };
  if(hr+ar > total) return { err:'Rounds won add up to '+(hr+ar)+' — more than the '+total+' played' };
  if(hr===ar) return { err:'Rounds are tied — one team must win more rounds' };
  if(hr+ar < total) return { warn:(total-hr-ar)+' round'+(total-hr-ar>1?'s':'')+' not assigned to either team' };
  return {};
}
function saveFixture(i, total, hr, ar, forfeitBy){
  const v = validateFixture(total, hr, ar);
  if(v.err){ toast(v.err); return; }
  const f = state.fixtures[i];
  Object.assign(f, { rounds:total, homeRounds:hr, awayRounds:ar, played:true, winner: hr>ar ? f.home : f.away, forfeit: forfeitBy || null });
  editingFixture = null;
  saveState(); render();
  const p = fixturePoints(f);
  toast(forfeitBy ? 'Match '+(i+1)+': '+L(forfeitBy)+' forfeits, '+L(f.winner)+' wins '+total+'–0'
                  : 'Match '+(i+1)+' saved. '+L(f.home)+' +'+p.home+', '+L(f.away)+' +'+p.away);
}
function clearFixture(i){
  Object.assign(state.fixtures[i], { played:false, winner:null, rounds:null, homeRounds:null, awayRounds:null, forfeit:null });
  editingFixture = null;
  saveState(); render();
  toast('Match '+(i+1)+' cleared');
}
function standingsTable(){
  const rows = LEADER_KEYS.map(name=>({ name, played:0, won:0, lost:0, rw:0, rl:0, points:0 }));
  const by = Object.fromEntries(rows.map(r=>[r.name,r]));
  state.fixtures.forEach(f=>{
    if(!f.played) return;
    const h = by[f.home], a = by[f.away];
    if(!h || !a) return;
    const pts = fixturePoints(f);
    h.played++; a.played++;
    if(f.winner===f.home){ h.won++; a.lost++; } else { a.won++; h.lost++; }
    const hr = f.homeRounds||0, ar = f.awayRounds||0;
    h.rw += hr; h.rl += ar; a.rw += ar; a.rl += hr;
    h.points += pts.home; a.points += pts.away;
  });
  rows.forEach(r=>{ r.diff = r.rw - r.rl; });
  rows.sort((a,b)=> b.points-a.points || b.won-a.won || b.diff-a.diff || a.name.localeCompare(b.name));
  return rows;
}
function groupStageComplete(){ return state.fixtures.every(f=>f.played); }
/* Playoff format: #1 → bye to Grand Final · #2 vs #3 → Semi-final (Bo3) · #4 eliminated.
   Grand Final (Bo5): #1 vs Semi-final winner. */
const PLAYOFF_BO = { semi:3, final:5 };
const winsNeeded = bo => Math.ceil(bo/2);
let editingPlayoff = null;
function playoffPicture(){
  const seeds = standingsTable().map(r=>r.name);
  const semiTeams = [seeds[1], seeds[2]];
  let semi = state.playoffs.semi;
  const semiStale = !!(semi && (semi.a!==semiTeams[0] || semi.b!==semiTeams[1]));
  if(semiStale) semi = null;
  const finalTeams = [seeds[0], semi ? semi.winner : null];
  let fin = state.playoffs.final;
  const finStale = !!(fin && (!semi || fin.a!==finalTeams[0] || fin.b!==finalTeams[1]));
  if(finStale) fin = null;
  return { seeds, semiTeams, semi, semiStale, finalTeams, fin, finStale };
}
function validateSeries(bo, ga, gb){
  const need = winsNeeded(bo);
  if(!Number.isInteger(ga) || !Number.isInteger(gb) || ga<0 || gb<0) return 'Enter games won for both teams';
  if(ga===gb) return 'Series can\'t end level — one team must reach '+need;
  if(Math.max(ga,gb)!==need) return 'Winner must win exactly '+need+' games (Best of '+bo+')';
  return '';
}
function savePlayoff(stage, ga, gb, forfeitSide){
  if(!groupStageComplete()){ toast('Finish all group matches first'); return; }
  const pic = playoffPicture();
  const [a,b] = stage==='semi' ? pic.semiTeams : pic.finalTeams;
  if(!a || !b){ toast('Play the Semi-final first'); return; }
  const err = validateSeries(PLAYOFF_BO[stage], ga, gb);
  if(err){ toast(err); return; }
  const winner = ga>gb ? a : b;
  const prev = state.playoffs[stage];
  state.playoffs[stage] = { a, b, ga, gb, winner, forfeit: forfeitSide || null };
  if(stage==='semi' && prev && prev.winner!==winner) state.playoffs.final = null;   // finalist changed
  editingPlayoff = null;
  saveState(); render();
  toast((stage==='semi'?'Semi-final':'Grand Final')+' saved. '+L(winner)+' wins '+Math.max(ga,gb)+'–'+Math.min(ga,gb)+(forfeitSide ? ' by forfeit' : ''));
}
function clearPlayoff(stage){
  state.playoffs[stage] = null;
  if(stage==='semi') state.playoffs.final = null;
  editingPlayoff = null;
  saveState(); render();
}

      <div class="fx-head"><span class="fx-label">Match ${i+1}, ${esc(fmt.map)}</span>
        <label class="fx-rounds">Rounds <input class="num-input sm" type="number" inputmode="numeric" id="fxTotal" min="1" max="99" value="${total}"></label></div>
      <div class="fx-row win" ${tv(H)}><span class="fx-team">${esc(L(H))}</span><input class="num-input sm" type="number" inputmode="numeric" id="fxHome" min="0" placeholder="0" aria-label="${esc(L(H))} rounds won" value="${hr}"><span class="fx-pts" id="fxHomePts">0 pts</span></div>
      <div class="fx-row win" ${tv(A)}><span class="fx-team">${esc(L(A))}</span><input class="num-input sm" type="number" inputmode="numeric" id="fxAway" min="0" placeholder="0" aria-label="${esc(L(A))} rounds won" value="${ar}"><span class="fx-pts" id="fxAwayPts">0 pts</span></div>
      <p class="fx-msg" id="fxMsg"></p>
      <div class="fx-actions"><button class="btn btn-red btn-sm" id="fxSave">Save result</button><button class="btn btn-sm" id="fxCancel">Cancel</button>${f.played ? `<button class="btn btn-danger btn-sm" id="fxClear">Clear</button>` : ''}</div>
      <div class="fx-forfeit"><span>Fewer than 3 players?</span><button class="mini-btn" data-ff="${H}">${esc(L(H))} forfeits</button><button class="mini-btn" data-ff="${A}">${esc(L(A))} forfeits</button></div>
    </article>`;
  }
  if(f.played){
    const p = fixturePoints(f);
    const hasR = typeof f.homeRounds==='number';
    const row = (n, r, pts)=>`<div class="fx-row ${f.winner===n?'win':''}" ${tv(n)}><span class="fx-team">${esc(L(n))}${f.forfeit===n ? ' <span class="ff-tag">Forfeit</span>' : ''}</span><span class="fx-score">${hasR ? r : (f.winner===n?'W':'L')}</span><span class="fx-pts">+${pts} pts</span></div>`;
    const mvp = matchMvp(f), nem = topRival(f);
    return `<article class="fx"><div class="fx-head"><span class="fx-label">Match ${i+1}, ${esc(fmt.map)}${hasR ? ', '+f.rounds+' rounds' : ''}</span><button class="mini-btn admin-only" data-fx-edit="${i}">Edit</button></div>${row(H,f.homeRounds,p.home)}${row(A,f.awayRounds,p.away)}
      ${mvp ? `<button class="mvp-chip" data-mvp="${i}" aria-label="Show Match ${i+1} MVP">👑 MVP <b>${esc(mvp.name)}</b><span class="k">${mvp.kills} kills</span></button>` : ''}
      ${nem ? `<p class="nemesis">🎯 ${nemText(nem)}</p>` : ''}
      <div class="fx-extra admin-only"><button class="mini-btn ${f.stats?'':'accent'}" data-fx-stats="${i}">${f.stats ? 'Edit kills' : 'Add kills'}</button></div></article>`;
  }
  return `<article class="fx fx-pending"><div class="fx-head"><span class="fx-label">Match ${i+1}, ${esc(fmt.map)}, ${fmt.rounds} rounds</span><button class="mini-btn accent admin-only" data-fx-edit="${i}">Enter result</button></div>
    <div class="fx-row" ${tv(H)}><span class="fx-team">${esc(L(H))}</span></div><div class="fx-row" ${tv(A)}><span class="fx-team">${esc(L(A))}</span></div></article>`;
}
function standingsHTML(){
  const rows = standingsTable();
  const done = state.fixtures.filter(f=>f.played).length;
  const tag = i=> i===0 ? '<span class="q-tag q-final">Final</span>' : i===3 ? '<span class="q-tag q-out">Out</span>' : '<span class="q-tag q-semi">Semi</span>';
  const rowsHTML = rows.map((r,i)=>`<div class="tr ${i===0?'r1':''}" role="row" style="--team:${teamColor(r.name)}">
      <span class="rk">${i+1}</span>
      <div class="tm"><div class="tm-text"><div class="tm-name">${esc(L(r.name))}</div><div class="tm-nick">${esc(shortNick(r.name))}</div></div>${tag(i)}</div>
      <span class="c c-p">${r.played}</span><span class="c c-w">${r.won}</span><span class="c c-l">${r.lost}</span>
      <span class="c c-rd">${r.diff>0?'+':''}${r.diff}</span><span class="c c-pts">${r.points}</span></div>`).join('');
  const per = fixturesPerBlock();
  const legNames = ['First leg','Return leg','Third leg','Fourth leg'];
  let legsHTML = '';
  for(let start=0, leg=0; start<state.fixtures.length; start+=per, leg++){
    const fmt = fixtureFormat(start);
    const from = leg*3+1, to = leg*3+3;
    legsHTML += `<div class="leg-head"><h3>${legNames[leg] || 'Leg '+(leg+1)}</h3><p>Matches ${from} to ${to} for each team on ${esc(fmt.map)}, ${fmt.rounds} rounds.</p></div>
      <div class="fx-grid">${state.fixtures.slice(start, start+per).map((f,j)=>fixtureRowHTML(f, start+j)).join('')}</div>`;
  }
  return `<div class="page-head"><h1>Standings</h1><p>${scoringSummary()}</p></div>
    <div class="table" role="table" aria-label="Points table">
      <div class="tr th" role="row"><span>#</span><span>Team</span><span class="c c-p">P</span><span class="c c-w">W</span><span class="c c-l">L</span><span class="c c-rd">RD</span><span class="c c-pts">Pts</span></div>
      ${rowsHTML}
    </div>
    <p class="fine">RD is rounds won minus rounds lost. Ties are split by wins, then RD. First place goes straight to the Grand Final, second and third play the Semi-final, and fourth is eliminated.</p>
    <div class="block-head" style="margin-top:30px;"><h2>Fixtures</h2><span class="count">${done} of ${state.fixtures.length} played</span></div>
    ${legsHTML}`;
}
function bindStandingsEvents(){
  document.querySelectorAll('#standings [data-fx-edit]').forEach(b=>{
    b.onclick = ()=>{ editingFixture = parseInt(b.dataset.fxEdit,10); renderStandingsOnly();
      const h = document.getElementById('fxHome'); if(h) h.focus(); };
  });
  const tot = document.getElementById('fxTotal');
  if(!tot) return;
  const home = document.getElementById('fxHome'), away = document.getElementById('fxAway');
  const i = editingFixture, f = state.fixtures[i];
  const num = el=> el.value==='' ? NaN : Number(el.value);
  const preview = ()=>{
    const total = num(tot), hr = num(home), ar = num(away);
    const ppr = state.scoring.pointsPerRound;
    let hp = (hr>0?hr:0)*ppr, ap = (ar>0?ar:0)*ppr;
    if(!state.scoring.loserKeeps){ if(hr>ar) ap = 0; else if(ar>hr) hp = 0; }
    document.getElementById('fxHomePts').textContent = hp+' pts';
    document.getElementById('fxAwayPts').textContent = ap+' pts';
    const v = (isNaN(hr) && isNaN(ar)) ? {} : validateFixture(total, hr, ar);
    const msg = document.getElementById('fxMsg');
    msg.textContent = v.err || v.warn || '';
    msg.className = 'fx-msg' + (v.err ? ' err' : '');
  };
  home.oninput = ()=>{ home.dataset.touched='1'; const t=num(tot), h=num(home);
    if(!away.dataset.touched && !isNaN(t) && !isNaN(h)) away.value = Math.max(0, t-h); preview(); };
  away.oninput = ()=>{ away.dataset.touched='1'; const t=num(tot), a=num(away);
    if(!home.dataset.touched && !isNaN(t) && !isNaN(a)) home.value = Math.max(0, t-a); preview(); };
  tot.oninput = ()=>{ const t=num(tot), h=num(home);
    if(home.dataset.touched && !away.dataset.touched && !isNaN(t) && !isNaN(h)) away.value = Math.max(0, t-h); preview(); };
  preview();
  document.getElementById('fxSave').onclick = ()=> saveFixture(i, num(tot), num(home), num(away));
  document.getElementById('fxCancel').onclick = ()=>{ editingFixture = null; renderStandingsOnly(); };
  const clr = document.getElementById('fxClear'); if(clr) clr.onclick = ()=> clearFixture(i);
  document.querySelectorAll('#standings [data-ff]').forEach(b=>{
    b.onclick = ()=>{
      const total = num(tot);
      if(!Number.isInteger(total) || total<1){ toast('Enter the number of rounds first'); return; }
      const loser = b.dataset.ff;
      saveFixture(i, total, loser===f.home ? 0 : total, loser===f.home ? total : 0, loser);
    };
  });
}
function renderStandingsOnly(){
  document.getElementById('standings').innerHTML = standingsHTML();
  bindStandingsEvents();
}
